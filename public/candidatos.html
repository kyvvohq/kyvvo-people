    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Candidatos</h1></div>
        </div>

          <button class="btn" id="btn-adicionar-candidato" type="button"><span data-icon="plus" data-size="16"></span>Adicionar candidato</button>
        </div>

  <footer data-ds-rodape data-ds-produto="People"></footer>

  <script src="/ds/components.js"></script>
  <script src="/people/shell.js"></script>
  <script>
    const STATUS_CLASSE = { nova: 'destaque', reprovada: 'perigo', aprovada: 'sucesso' };
    const STATUS_LABEL = { nova: 'Nova', reprovada: 'Reprovada', aprovada: 'Aprovada' };

    let candidaturas = [];
    let vagas = [];
    let pessoasExpandidas = new Set();

    async function carregarListas() {
      const [resCand, resVagas] = await Promise.all([
        apiFetch('/people/api/candidaturas'),
        apiFetch('/people/api/vagas'),
      ]);
      candidaturas = await resCand.json();
      vagas = await resVagas.json();
    }

    // Uma pessoa pode ter várias candidaturas simultâneas — a listagem
    // mostra 1 linha por pessoa (não por candidatura), com a vaga mais
    // antiga entre as ainda em andamento (vaga encerrada não conta pra
    // essa escolha, mas a candidatura em si nunca some da base). Se a
    // pessoa concorre a mais de uma vaga ativa ao mesmo tempo, mostra um
    // badge "+N" — o detalhe de cada candidatura fica a 1 clique, sem
    // duplicar linha na tabela.
    function agruparPorPessoa() {
      const porPessoa = new Map();
      candidaturas.forEach((c) => {
        if (!porPessoa.has(c.candidato_id)) porPessoa.set(c.candidato_id, []);
        porPessoa.get(c.candidato_id).push(c);
      });
      return Array.from(porPessoa.values()).map((lista) => {
        const porIdadeAsc = [...lista].sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em));
        const ativas = porIdadeAsc.filter((c) => c.vaga_status !== 'encerrada');
        const principal = ativas[0] || porIdadeAsc[0];
        const extrasList = ativas.slice(1);
        const maisRecente = [...lista].sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em))[0];
        return { principal, extrasList, extras: extrasList.length, ordenacao: maisRecente.criado_em };
      }).sort((a, b) => new Date(b.ordenacao) - new Date(a.ordenacao));
    }

    function renderizarLista() {
      const container = document.getElementById('lista-container');
      const grupos = agruparPorPessoa();
      container.innerHTML = `
        <table>
          <thead><tr><th>Nome</th><th>Vaga</th><th>Contato</th><th>Etapa</th><th>Candidatou-se em</th></tr></thead>
          <tbody>
            ${grupos.map(({ principal: c, extras, extrasList }) => {
              const expandido = extras > 0 && pessoasExpandidas.has(c.candidato_id);
              const linhaPrincipal = `
                <tr class="linha-candidatura" data-id="${c.id}" style="cursor:pointer">
                  <td>${c.nome}</td>
                  <td>${extras > 0 ? `<span class="badge neutro badge-mais-vagas" data-toggle-extras="${c.candidato_id}" title="${expandido ? 'Ocultar' : 'Mostrar'} mais ${extras} vaga(s)" style="cursor:pointer">+${extras}</span> ` : ''}${c.vaga_nome}${c.vaga_status === 'encerrada' ? ' <span class="badge neutro">Encerrada</span>' : ''}</td>
                  <td>${c.whatsapp} · ${c.email}</td>
                  <td><span class="badge ${STATUS_CLASSE[c.status]}">${STATUS_LABEL[c.status]}</span></td>
                  <td>${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td>
                </tr>
              `;
              const linhasExtras = expandido ? extrasList.map((x) => `
                <tr class="linha-candidatura linha-candidatura-extra" data-id="${x.id}" style="cursor:pointer">
                  <td></td>
                  <td>${x.vaga_nome}${x.vaga_status === 'encerrada' ? ' <span class="badge neutro">Encerrada</span>' : ''}</td>
                  <td></td>
                  <td><span class="badge ${STATUS_CLASSE[x.status]}">${STATUS_LABEL[x.status]}</span></td>
                  <td>${new Date(x.criado_em).toLocaleDateString('pt-BR')}</td>
                </tr>
              `).join('') : '';
              return linhaPrincipal + linhasExtras;
            }).join('') || ''}
          </tbody>
        </table>
        ${!grupos.length ? '<div class="vazio" style="padding:16px">Nenhuma candidatura recebida ainda.</div>' : ''}
      `;
      container.querySelectorAll('[data-toggle-extras]').forEach((badge) => {
        badge.addEventListener('click', (e) => {
          e.stopPropagation();
          const candidatoId = badge.dataset.toggleExtras;
          if (pessoasExpandidas.has(candidatoId)) pessoasExpandidas.delete(candidatoId);
          else pessoasExpandidas.add(candidatoId);
          renderizarLista();
        });
      });
      container.querySelectorAll('.linha-candidatura').forEach((el) => {
        el.addEventListener('click', () => {
          window.location.href = `/people/candidato-detalhe.html?id=${el.dataset.id}`;
        });
      });
    }

    // --- Adicionar candidato (importação de currículo primeiro, formulário depois) ---
    function opcoesVagas(selecionadoId) {
      return vagas.map((v) => `<option value="${v.id}" ${v.id === selecionadoId ? 'selected' : ''}>${v.nome}</option>`).join('');
    }

    function formularioCandidato({ titulo, valores, aoSalvar }) {
      const v = valores || {};
      const jaTemArquivo = Boolean(v.arquivoBase64);
      abrirModal(
        `<h3>${titulo}</h3>`,
        `
          <form id="form-candidato-manual">
            <div class="modal-erro" id="msg-candidato-manual"></div>
            <label for="cm-vaga">Vaga *</label>
            <select id="cm-vaga" required><option value="">Selecione</option>${opcoesVagas(v.vaga_id)}</select>
            <div class="grid2">
              <div><label for="cm-nome">Nome completo *</label><input id="cm-nome" required value="${v.nome || ''}"></div>
              <div><label for="cm-whatsapp">WhatsApp *</label><input id="cm-whatsapp" required value="${v.whatsapp || ''}"></div>
            </div>
            <div class="grid2">
              <div><label for="cm-email">E-mail *</label><input id="cm-email" type="email" required value="${v.email || ''}"></div>
              <div><label for="cm-linkedin">LinkedIn</label><input id="cm-linkedin" value="${v.linkedin || ''}"></div>
            </div>
            <label for="cm-curriculo">Currículo (PDF ou DOCX)</label>
            ${jaTemArquivo ? `<p class="campo-ajuda">Já anexado: ${v.curriculoNome}. Escolha outro arquivo abaixo só se quiser substituir.</p>` : ''}
            <div class="campo-arquivo"><input id="cm-curriculo" type="file" accept=".pdf,.docx"></div>
            <div class="modal-acoes">
              <button type="button" class="btn-secundario" id="cancelar-candidato-manual">Cancelar</button>
              <button type="submit" class="btn">Salvar candidato</button>
            </div>
          </form>
        `
      );
      document.getElementById('cancelar-candidato-manual').addEventListener('click', fecharModal);
      document.getElementById('form-candidato-manual').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('msg-candidato-manual');
        msg.textContent = '';
        const form = new FormData();
        form.append('vaga_id', document.getElementById('cm-vaga').value);
        form.append('nome', document.getElementById('cm-nome').value);
        form.append('whatsapp', document.getElementById('cm-whatsapp').value);
        form.append('email', document.getElementById('cm-email').value);
        form.append('linkedin', document.getElementById('cm-linkedin').value);
        const arquivo = document.getElementById('cm-curriculo').files[0];
        if (arquivo) form.append('curriculo', arquivo);
        else if (jaTemArquivo) form.append('curriculo', base64ParaBlob(v.arquivoBase64, v.curriculoTipo), v.curriculoNome);

        try {
          await aoSalvar(form, msg);
        } catch (err) {
          msg.textContent = err.message;
        }
      });
    }

    function base64ParaBlob(base64, tipo) {
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: tipo });
    }

    async function salvarCandidatoManual(form, msg) {
      const res = await fetch('/people/api/candidaturas', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: form,
      });
      const data = await res.json();
      if (!res.ok) { msg.textContent = data.error || 'Falha ao salvar candidato'; return; }
      fecharModal();
      await carregarListas();
      renderizarLista();
    }

    // Primeiro passo: importar o currículo (preenche nome/e-mail/WhatsApp/
    // LinkedIn automaticamente); "Preencher manualmente" pula direto pro
    // formulário em branco pra quem não tem arquivo em mãos.
    function abrirFluxoAdicionarCandidato() {
      abrirModal(
        '<h3>Adicionar candidato</h3>',
        `
          <form id="form-importar-inicial">
            <div class="modal-erro" id="msg-importar-inicial"></div>
            <label for="arquivo-importar-inicial">Currículo (PDF ou DOCX)</label>
            <div class="campo-arquivo"><input id="arquivo-importar-inicial" type="file" accept=".pdf,.docx" required></div>
            <p class="campo-ajuda">O sistema lê o arquivo e tenta preencher nome, e-mail, WhatsApp e LinkedIn automaticamente — você confere e ajusta antes de salvar.</p>
            <div class="modal-acoes">
              <button type="button" class="btn-secundario" id="pular-importar-inicial">Preencher manualmente</button>
              <button type="submit" class="btn">Analisar currículo</button>
            </div>
          </form>
        `
      );
      document.getElementById('pular-importar-inicial').addEventListener('click', () => {
        fecharModal();
        formularioCandidato({ titulo: 'Adicionar candidato', valores: {}, aoSalvar: salvarCandidatoManual });
      });
      document.getElementById('form-importar-inicial').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('msg-importar-inicial');
        const arquivo = document.getElementById('arquivo-importar-inicial').files[0];
        if (!arquivo) return;
        msg.textContent = 'Analisando...';

        const form = new FormData();
        form.append('curriculo', arquivo);
        const res = await fetch('/people/api/candidaturas/extrair-curriculo', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: form,
        });
        const dados = await res.json();
        if (!res.ok) { msg.textContent = dados.error || 'Falha ao ler o currículo'; return; }

        formularioCandidato({
          titulo: 'Confira os dados extraídos',
          valores: dados,
          aoSalvar: salvarCandidatoManual,
        });
      });
    }

    document.getElementById('btn-adicionar-candidato').addEventListener('click', abrirFluxoAdicionarCandidato);

    async function iniciar() {
      await carregarListas();
      renderizarLista();
    }

    iniciar();
  </script>
