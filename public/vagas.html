<script>(function(){var m={escuro:'dark',claro:'light',dark:'dark',light:'light'};document.documentElement.setAttribute('data-theme',m[localStorage.getItem('people_tema')]||'light');})();</script>

<style>
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media(max-width:520px) { .grid2 { grid-template-columns:1fr; } }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips .badge { display:inline-flex; align-items:center; gap:2px; }
  .linha-requisito { display:grid; grid-template-columns:2fr 1fr 1fr 130px 80px 90px 28px; gap:8px; align-items:center; margin-bottom:8px; }
  @media(max-width:700px) { .linha-requisito { grid-template-columns:1fr 1fr; } }

  .visualizacao-toggle { display:inline-flex; gap:4px; background:var(--surface-muted); border-radius:var(--radius-md); padding:4px; margin-bottom:16px; }
  .visualizacao-toggle button { background:transparent; color:var(--muted-strong); border:none; border-radius:8px;
    padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; height:auto; margin:0; }
  .visualizacao-toggle button.ativo { background:var(--card); color:var(--text); box-shadow:0 1px 2px rgba(15,17,26,.08); }

  .menu-acoes { position:relative; display:inline-block; }
  .menu-acoes-btn { background:transparent; color:var(--muted); width:32px; height:32px; padding:0; margin:0;
    border-radius:8px; display:inline-flex; align-items:center; justify-content:center; }
  .menu-acoes-btn:hover { background:var(--surface-muted); color:var(--text); }
  .menu-acoes-painel { position:absolute; top:calc(100% + 4px); right:0; min-width:180px; background:var(--card);
    border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:0 12px 32px rgba(15,17,26,.12); padding:6px; z-index:40; }
  .menu-acoes-painel a { display:block; padding:8px 10px; border-radius:8px; font-size:13px; color:var(--text-secondary); text-decoration:none; }
  .menu-acoes-painel a:hover { background:var(--surface-muted); }
  .menu-acoes-painel a.perigo { color:var(--danger); }
  .btn-perigo { background:var(--danger); color:#fff; }
  .btn-perigo:hover { background:var(--danger); filter:brightness(0.92); }

  /* Visão em colunas: mesma estrutura raia×coluna do Quadro (menu
     Quadro) — aqui raia = vaga, coluna = status, e cada raia só tem 1
     cartão populado (a própria vaga), na coluna do status atual. Reusa
     os nomes de classe do quadro.html de propósito (são <style> isolados
     por página, não colidem) pra manter o mesmo sistema visual. */
  /* Só contém o overflow horizontal quando a visão em colunas está ativa
     (classe alternada via JS) — sem isso o grid largo do kanban faria a
     página inteira rolar de lado; mas aplicar isso sempre clipparia a
     tabela da visão em Lista sem dar jeito de rolar até o fim em telas
     estreitas. */
  .painel-main.conter-scroll-x { overflow-x:hidden; }
  .quadro-scroll { overflow-x:auto; padding-bottom:12px; }
  .quadro-grid { display:grid; grid-auto-rows:min-content; gap:10px; align-items:start; }
  .raia-label { position:sticky; left:0; padding:10px 8px; font-weight:700; font-size:13px; border-radius:var(--radius-md);
    display:flex; align-items:center; z-index:3; color:var(--text); }
  .coluna-header { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); min-width:200px; }
  .celula { border:1px dashed var(--border-strong); border-radius:var(--radius-md); padding:8px; min-width:200px; min-height:64px;
    display:flex; flex-direction:column; gap:6px; }
  .celula.arrastando-sobre { border-color:var(--accent); }
  .cartao { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; cursor:grab; }
  .cartao:active { cursor:grabbing; }
  .cartao-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .cartao .nome { font-weight:700; color:var(--text); }
  .cartao .data { color:var(--muted); font-size:11px; margin-top:4px; }
  .celula-vazia { color:var(--muted); font-size:11px; padding:6px; }

  .filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); }
  .filtros select { height:36px; }
  tr.linha-vaga, .cartao { cursor:pointer; }
</style>
</head>

        <li><a class="ds-menu-link" href="/people/painel.html"><span class="ds-menu-icone" data-icon="layout-dashboard"></span><span class="ds-menu-rotulo">Início</span></a></li>

  <script>
    const STATUS_CLASSE = { rascunho: 'neutro', nova: 'destaque', em_andamento: 'aviso', pausada: 'aviso', encerrada: 'neutro', cancelada: 'perigo' };
    const STATUS_LABEL = { rascunho: 'Rascunho', nova: 'Nova', em_andamento: 'Em andamento', pausada: 'Pausada', encerrada: 'Encerrada', cancelada: 'Cancelada' };
    const CAMPOS = ['nome', 'empresa', 'cidade', 'descricao', 'salario', 'modalidade', 'tipo_vaga', 'nivel_experiencia', 'requisitos'];
    const CAMPOS_OBRIGATORIOS = ['nome', 'descricao', 'requisitos'];
    const CAMPOS_EXCLUIDOS_DEFAULT = ['idade', 'ano_formatura', 'genero', 'estado_civil', 'nome', 'foto', 'endereco_completo', 'gaps_temporais_nao_justificados'];

    let formRequisitos = [];
    let formCamposExtras = [];
    let vagas = [];
    let vagasFiltroStatus = '';
    let visualizacao = localStorage.getItem('people_vagas_visualizacao') === 'kanban' ? 'kanban' : 'lista';
    const STATUS_ORDEM = ['rascunho', 'nova', 'em_andamento', 'pausada', 'encerrada'];
    // Mesmos tons leves do menu Quadro, rotativos por posição da raia.
    const CORES_RAIA = ['#F1EEFF', '#E6F9FC', '#E9FBF2', '#FFF6E8'];

    function menuAcoesHtml(v) {
      const podeCancelar = v.status !== 'encerrada' && v.status !== 'cancelada';
      return `
        <div class="menu-acoes">
          <button class="menu-acoes-btn" type="button" data-abrir-menu="${v.id}" aria-label="Ações" title="Ações">${icon('ellipsis-vertical', 18)}</button>
          <div class="menu-acoes-painel" id="menu-acoes-${v.id}" hidden>
            <a href="#" data-editar="${v.id}">Editar</a>
            <a href="#" data-duplicar="${v.id}">Duplicar</a>
            <a href="#" data-candidaturas="${v.id}" data-nome="${v.nome}">Ver candidaturas</a>
            <a href="#" data-link="${v.id}">Copiar link</a>
            ${podeCancelar ? `<a href="#" class="perigo" data-cancelar="${v.id}" data-nome="${v.nome}">Cancelar vaga</a>` : ''}
          </div>
        </div>
      `;
    }

    function fecharMenusAcoes() {
      document.querySelectorAll('.menu-acoes-painel').forEach((p) => { p.hidden = true; });
    }

    function aplicarVisualizacao() {
      document.getElementById('vista-lista').hidden = visualizacao !== 'lista';
      document.getElementById('vista-kanban').hidden = visualizacao !== 'kanban';
      document.querySelector('.painel-main').classList.toggle('conter-scroll-x', visualizacao === 'kanban');
      document.querySelectorAll('#visualizacao-toggle button').forEach((b) => b.classList.toggle('ativo', b.dataset.vis === visualizacao));
    }

    function renderizar() {
      if (visualizacao === 'kanban') renderizarKanban(); else renderizarLista();
    }

    // Filtro por status (client-side, mesmo padrão de avaliacoes.html) —
    // vagas.length continua sendo a fonte completa (usada por
    // vagas.find(...) nos handlers de ação), só o que é DESENHADO passa
    // pelo filtro.
    function vagasFiltradas() {
      return vagas
        .filter((v) => !vagasFiltroStatus || v.status === vagasFiltroStatus)
        .filter(vagaPassaNoFiltroData);
    }

    function renderizarLista() {
      const corpo = document.getElementById('tabela-vagas');
      corpo.innerHTML = vagasFiltradas().map((v) => `
        <tr class="linha-vaga" data-id="${v.id}">
          <td>${v.status === 'rascunho' ? '<span class="badge neutro" style="margin-right:6px">Rascunho</span>' : ''}${v.nome}</td>
          <td><span class="badge ${STATUS_CLASSE[v.status]}">${STATUS_LABEL[v.status]}</span></td>
          <td>${v.total_candidatos}</td>
          <td>${v.total_em_andamento}</td>
          <td>${new Date(v.criado_em).toLocaleDateString('pt-BR')}</td>
          <td>${v.finalizada_em ? new Date(v.finalizada_em).toLocaleDateString('pt-BR') : '—'}</td>
          <td>${menuAcoesHtml(v)}</td>
        </tr>
      `).join('') || '<tr><td colspan="7" class="vazio">Nenhuma vaga cadastrada ainda.</td></tr>';
    }

    // Raia = vaga, coluna = status — cada raia só tem 1 cartão populado
    // (a própria vaga), na coluna do status atual; arrastar pra outra
    // coluna da mesma raia muda o status (igual ao Quadro, só que lá a
    // raia guarda N cartões de candidatura por etapa).
    function renderizarKanban() {
      const grid = document.getElementById('kanban-vagas');
      grid.style.gridTemplateColumns = `10px repeat(${STATUS_ORDEM.length}, minmax(200px, 1fr))`;

      let html = '<div></div>';
      STATUS_ORDEM.forEach((status) => {
        html += `<div class="coluna-header">${STATUS_LABEL[status]}</div>`;
      });

      // Cancelada não entra no Quadro: é um estado abortado, não uma etapa do
      // fluxo normal (nova > em andamento > pausada > encerrada) — sem
      // coluna própria, uma raia de vaga cancelada ficaria com todas as
      // células vazias, o que é confuso. Ela continua visível na Lista e no
      // filtro de status.
      const lista = vagasFiltradas().filter((v) => v.status !== 'cancelada');
      lista.forEach((v, indice) => {
        const cor = CORES_RAIA[indice % CORES_RAIA.length];
        html += `<div class="raia-label" style="background:${cor}" title="${v.nome}"></div>`;
        STATUS_ORDEM.forEach((status) => {
          html += `<div class="celula" data-vaga-status="${v.id}" data-status="${status}" style="background:${cor}">`;
          html += status === v.status ? `
            <div class="cartao" draggable="true" data-cartao-vaga="${v.id}">
              <div class="cartao-topo">
                <span class="nome">${v.nome}</span>
                ${menuAcoesHtml(v)}
              </div>
              <div class="data">${new Date(v.criado_em).toLocaleDateString('pt-BR')}</div>
            </div>
          ` : '<div class="celula-vazia">—</div>';
          html += '</div>';
        });
      });

      grid.innerHTML = html;
      if (!lista.length) {
        grid.insertAdjacentHTML('beforeend', '<div class="celula-vazia" style="grid-column:1/-1">Nenhuma vaga cadastrada ainda.</div>');
      }
      ligarDragDropVagas();
    }

    function ligarDragDropVagas() {
      document.querySelectorAll('[data-cartao-vaga]').forEach((cartao) => {
        cartao.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', cartao.dataset.cartaoVaga);
        });
      });
      document.querySelectorAll('[data-vaga-status]').forEach((celula) => {
        celula.addEventListener('dragover', (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          celula.classList.add('arrastando-sobre');
        });
        celula.addEventListener('dragleave', () => celula.classList.remove('arrastando-sobre'));
        celula.addEventListener('drop', async (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          celula.classList.remove('arrastando-sobre');
          const vagaId = e.dataTransfer.getData('text/plain');
          const novoStatus = celula.dataset.status;
          const vaga = vagas.find((v) => v.id === vagaId);
          if (!vaga || vaga.status === novoStatus) return;

          vaga.status = novoStatus;
          renderizarKanban();
          const res = await apiFetch(`/people/api/vagas/${vagaId}`, { method: 'PATCH', body: JSON.stringify({ status: novoStatus }) });
          if (!res.ok) { avisar('Erro', 'Falha ao mover vaga'); carregarVagas(); }
        });
      });
    }

    document.getElementById('visualizacao-toggle').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-vis]');
      if (!btn) return;
      visualizacao = btn.dataset.vis;
      localStorage.setItem('people_vagas_visualizacao', visualizacao);
      aplicarVisualizacao();
      renderizar();
    });

    const filtroStatusEl = document.getElementById('filtro-status-vaga');
    STATUS_ORDEM.forEach((status) => {
      filtroStatusEl.insertAdjacentHTML('beforeend', `<option value="${status}">${STATUS_LABEL[status]}</option>`);
    });
    // "Cancelada" fica de fora do STATUS_ORDEM (não tem coluna no Quadro,
    // ver renderizarKanban) mas ainda precisa aparecer aqui pra dar pra
    // filtrar a Lista por vagas canceladas.
    filtroStatusEl.insertAdjacentHTML('beforeend', '<option value="cancelada">Cancelada</option>');
    filtroStatusEl.addEventListener('change', () => {
      vagasFiltroStatus = filtroStatusEl.value;
      renderizar();
    });

    // --- Filtro de data: período (criada→finalizada) OU "a partir de uma
    // data" num campo escolhido (criada em / finalizada em). Client-side,
    // mesmo padrão do filtro de status (vagas.length é sempre a fonte
    // completa, só o que é desenhado passa pelo filtro). ---
    let filtroData = null; // { modo: 'periodo', criadaDe, finalizadaAte } | { modo: 'apartir', campo, data }
    const elModo = document.getElementById('filtro-data-modo');
    const elPeriodo = document.getElementById('filtro-data-periodo');
    const elApartir = document.getElementById('filtro-data-apartir');
    const elCriadaDe = document.getElementById('filtro-criada-de');
    const elFinalizadaAte = document.getElementById('filtro-finalizada-ate');
    const elApartirCampo = document.getElementById('filtro-apartir-campo');
    const elApartirData = document.getElementById('filtro-apartir-data');
    const elErroFiltroData = document.getElementById('erro-filtro-data');

    function aplicarFiltroDataInputs() {
      elErroFiltroData.textContent = '';
      const modo = elModo.value;
      elPeriodo.hidden = modo !== 'periodo';
      elApartir.hidden = modo !== 'apartir';

      if (modo === 'periodo') {
        const criadaDe = elCriadaDe.value;
        const finalizadaAte = elFinalizadaAte.value;
        if (criadaDe && finalizadaAte && criadaDe > finalizadaAte) {
          elErroFiltroData.textContent = '"Criada em" não pode ser depois de "Finalizada em".';
          filtroData = null;
        } else if (criadaDe || finalizadaAte) {
          filtroData = { modo, criadaDe: criadaDe || null, finalizadaAte: finalizadaAte || null };
        } else {
          filtroData = null;
        }
      } else if (modo === 'apartir') {
        const data = elApartirData.value;
        filtroData = data ? { modo, campo: elApartirCampo.value, data } : null;
      } else {
        filtroData = null;
      }
      renderizar();
    }

    [elModo, elCriadaDe, elFinalizadaAte, elApartirCampo, elApartirData].forEach((el) => {
      el.addEventListener('change', aplicarFiltroDataInputs);
    });

    function vagaPassaNoFiltroData(v) {
      if (!filtroData) return true;
      if (filtroData.modo === 'periodo') {
        if (filtroData.criadaDe && v.criado_em.slice(0, 10) < filtroData.criadaDe) return false;
        if (filtroData.finalizadaAte) {
          if (!v.finalizada_em || v.finalizada_em.slice(0, 10) > filtroData.finalizadaAte) return false;
        }
        return true;
      }
      // apartir: campo >= data (vaga sem finalizada_em não casa filtro por esse campo)
      const valor = v[filtroData.campo];
      if (!valor) return false;
      return valor.slice(0, 10) >= filtroData.data;
    }

    async function carregarVagas() {
      const res = await apiFetch('/people/api/vagas');
      vagas = await res.json();
      aplicarVisualizacao();
      renderizar();
    }

    async function copiarLink(vaga) {
      const url = `${window.location.origin}/people/vaga/${vaga.id}`;
      try {
        await navigator.clipboard.writeText(url);
        avisar('Link copiado', url);
      } catch {
        avisar('Não foi possível copiar automaticamente', `Copie manualmente: ${url}`);
      }
      if (vaga.status === 'nova') {
        await apiFetch(`/people/api/vagas/${vaga.id}`, { method: 'PATCH', body: JSON.stringify({ status: 'em_andamento' }) });
        vaga.status = 'em_andamento';
        renderizar();
      }
    }

    function formularioVaga(vaga, modo) {
      const v = vaga || {};
      const editando = modo === 'editar';
      return `
        <div class="modal-erro" id="msg-vaga"></div>
        <label for="nome">Nome da vaga *</label>
        <input id="nome" required value="${v.nome || ''}">
        <div class="grid2">
          <div><label for="empresa">Empresa</label><input id="empresa" value="${v.empresa || ''}"></div>
          <div><label for="cidade">Cidade</label><input id="cidade" value="${v.cidade || ''}"></div>
        </div>
        <div class="grid2">
          <div>
            <label for="modalidade">Modalidade</label>
            <select id="modalidade">
              <option value="" ${!v.modalidade ? 'selected' : ''}>Selecione</option>
              <option ${v.modalidade === 'Presencial' ? 'selected' : ''}>Presencial</option>
              <option ${v.modalidade === 'Remoto' ? 'selected' : ''}>Remoto</option>
              <option ${v.modalidade === 'Híbrido' ? 'selected' : ''}>Híbrido</option>
            </select>
          </div>
          <div>
            <label for="tipo_vaga">Tipo de vaga</label>
            <select id="tipo_vaga">
              <option value="" ${!v.tipo_vaga ? 'selected' : ''}>Selecione</option>
              <option ${v.tipo_vaga === 'CLT' ? 'selected' : ''}>CLT</option>
              <option ${v.tipo_vaga === 'PJ' ? 'selected' : ''}>PJ</option>
              <option ${v.tipo_vaga === 'Estágio' ? 'selected' : ''}>Estágio</option>
              <option ${v.tipo_vaga === 'Integral' ? 'selected' : ''}>Integral</option>
              <option ${v.tipo_vaga === 'Meio período' ? 'selected' : ''}>Meio período</option>
            </select>
          </div>
        </div>
        <label for="descricao">Descrição *</label>
        <textarea id="descricao">${v.descricao || ''}</textarea>
        <div class="grid2">
          <div>
            <label for="salario">Salário</label>
            <input id="salario" placeholder="Ex: A combinar, R$ 3.000 a R$ 4.000" value="${v.salario || ''}">
          </div>
          <div>
            <label for="nivel_experiencia">Nível de experiência</label>
            <input id="nivel_experiencia" placeholder="Ex: Júnior, Pleno, Sênior" value="${v.nivel_experiencia || ''}">
          </div>
        </div>
        <label for="requisitos">Requisitos *</label>
        <textarea id="requisitos">${v.requisitos || ''}</textarea>
        ${editando ? `
          <label for="status">Status</label>
          <select id="status">
            <option value="rascunho" ${v.status === 'rascunho' ? 'selected' : ''}>Rascunho</option>
            <option value="nova" ${v.status === 'nova' ? 'selected' : ''}>Nova</option>
            <option value="em_andamento" ${v.status === 'em_andamento' ? 'selected' : ''}>Em andamento</option>
            <option value="pausada" ${v.status === 'pausada' ? 'selected' : ''}>Pausada</option>
            <option value="encerrada" ${v.status === 'encerrada' ? 'selected' : ''}>Encerrada</option>
          </select>
        ` : ''}
        <label>Pesos do score de aderência</label>
          <p class="campo-ajuda">Usados quando a psicóloga lança nota (0-100) em cada componente da candidatura — o "geral" é a média ponderada por esses pesos.</p>
          <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
            <div><label for="peso-tecnica">Técnica</label><input id="peso-tecnica" type="number" step="0.05" min="0" max="1" value="${(v.pesos && v.pesos.tecnica) ?? 0.4}"></div>
            <div><label for="peso-experiencia">Experiência</label><input id="peso-experiencia" type="number" step="0.05" min="0" max="1" value="${(v.pesos && v.pesos.experiencia) ?? 0.4}"></div>
            <div><label for="peso-entrevista">Entrevista</label><input id="peso-entrevista" type="number" step="0.05" min="0" max="1" value="${(v.pesos && v.pesos.entrevista) ?? 0.2}"></div>
          </div>

          <label>Requisitos estruturados (motor de match)</label>
          <p class="campo-ajuda">Fundação pro cálculo automático de aderência — hoje só grava os dados; o cálculo em si ainda é manual (lançar score no candidato). Eliminatório exige natureza legal, regulatória ou físico-logística — nenhum outro motivo exclui um candidato, não importa quantos eliminatórios a vaga tenha.</p>
          <div id="lista-requisitos-estruturados"></div>
          <button type="button" class="btn-secundario" id="btn-add-requisito" style="margin:4px 0 8px">+ Adicionar requisito</button>

          <label>Campos excluídos do score</label>
          <p class="campo-ajuda">Nunca entram no cálculo de aderência — a lista padrão não pode ser removida, só ampliada.</p>
          <div id="lista-campos-excluidos" class="chips"></div>
          <div class="campo-arquivo" style="margin-top:8px">
            <input id="novo-campo-excluido" placeholder="Ex: nome_da_faculdade" style="flex:1">
            <button type="button" class="btn-secundario" id="btn-add-campo-excluido">Adicionar</button>
          </div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar-vaga">Cancelar</button>
          <button type="submit" class="btn">${editando ? 'Salvar alterações' : 'Criar vaga'}</button>
        </div>
      `;
    }

    function renderizarRequisitos() {
      const el = document.getElementById('lista-requisitos-estruturados');
      el.innerHTML = formRequisitos.map((r, i) => `
        <div class="linha-requisito" data-i="${i}">
          <input class="req-capacidade" placeholder="Capacidade (ex: Controladoria)" value="${r.capacidade || ''}">
          <select class="req-categoria">
            <option value="tecnica" ${r.categoria === 'tecnica' ? 'selected' : ''}>Técnica</option>
            <option value="experiencia" ${r.categoria === 'experiencia' ? 'selected' : ''}>Experiência</option>
            <option value="idioma" ${r.categoria === 'idioma' ? 'selected' : ''}>Idioma</option>
            <option value="comportamental" ${r.categoria === 'comportamental' ? 'selected' : ''}>Comportamental</option>
          </select>
          <select class="req-nivel">
            <option value="eliminatorio" ${r.nivel_exigido === 'eliminatorio' ? 'selected' : ''}>Eliminatório</option>
            <option value="importante" ${r.nivel_exigido === 'importante' ? 'selected' : ''}>Importante</option>
            <option value="desejavel" ${r.nivel_exigido === 'desejavel' ? 'selected' : ''}>Desejável</option>
          </select>
          <select class="req-natureza" title="Só requisito legal, regulatório ou físico-logístico pode excluir um candidato" ${r.nivel_exigido === 'eliminatorio' ? '' : 'hidden'}>
            <option value="" ${!r.natureza ? 'selected' : ''} disabled>Natureza…</option>
            <option value="legal" ${r.natureza === 'legal' ? 'selected' : ''}>Legal</option>
            <option value="regulatorio" ${r.natureza === 'regulatorio' ? 'selected' : ''}>Regulatório</option>
            <option value="fisico_logistico" ${r.natureza === 'fisico_logistico' ? 'selected' : ''}>Físico-logístico</option>
          </select>
          <input class="req-peso" type="number" step="0.1" min="0" max="1" value="${r.peso ?? 0.5}" title="Peso">
          <input class="req-anos" type="number" min="0" step="1" placeholder="Anos mín." value="${r.anos_minimos ?? ''}" title="Anos mínimos (só experiência)">
          <button type="button" class="btn-remover-requisito" data-i="${i}" title="Remover" style="background:transparent;color:var(--danger);padding:0">${icon('x', 16)}</button>
        </div>
      `).join('') || '<p class="campo-ajuda">Nenhum requisito estruturado ainda.</p>';

      el.querySelectorAll('.btn-remover-requisito').forEach((btn) => {
        btn.addEventListener('click', () => {
          sincronizarRequisitosDoDom();
          formRequisitos.splice(Number(btn.dataset.i), 1);
          renderizarRequisitos();
        });
      });
      // Natureza só faz sentido (e só é exigida no backend) quando o nível
      // é eliminatório — reconstrói a lista pra mostrar/esconder o campo
      // certo assim que o recrutador troca o nível de uma linha.
      el.querySelectorAll('.req-nivel').forEach((select) => {
        select.addEventListener('change', () => {
          sincronizarRequisitosDoDom();
          renderizarRequisitos();
        });
      });
    }

    function sincronizarRequisitosDoDom() {
      const el = document.getElementById('lista-requisitos-estruturados');
      if (!el) return;
      el.querySelectorAll('.linha-requisito').forEach((linha, i) => {
        const nivelExigido = linha.querySelector('.req-nivel').value;
        const naturezaEl = linha.querySelector('.req-natureza');
        formRequisitos[i] = {
          ...formRequisitos[i],
          capacidade: linha.querySelector('.req-capacidade').value,
          categoria: linha.querySelector('.req-categoria').value,
          nivel_exigido: nivelExigido,
          // Natureza só se aplica (e só persiste) em requisito eliminatório —
          // trocar pra importante/desejável descarta a natureza escolhida
          // antes, evita mandar lixo de uma seleção anterior.
          natureza: nivelExigido === 'eliminatorio' ? (naturezaEl.value || null) : null,
          peso: Number(linha.querySelector('.req-peso').value) || 0,
          anos_minimos: linha.querySelector('.req-anos').value ? Number(linha.querySelector('.req-anos').value) : null,
        };
      });
    }

    function renderizarCamposExcluidos() {
      const el = document.getElementById('lista-campos-excluidos');
      el.innerHTML = [
        ...CAMPOS_EXCLUIDOS_DEFAULT.map((c) => `<span class="badge neutro" title="Padrão fixo, não pode ser removido">${c}</span>`),
        ...formCamposExtras.map((c, i) => `<span class="badge aviso">${c} <button type="button" class="btn-remover-campo-excluido" data-i="${i}" style="background:transparent;border:none;color:inherit;cursor:pointer;padding:0 0 0 4px">×</button></span>`),
      ].join(' ');
      el.querySelectorAll('.btn-remover-campo-excluido').forEach((btn) => {
        btn.addEventListener('click', () => {
          formCamposExtras.splice(Number(btn.dataset.i), 1);
          renderizarCamposExcluidos();
        });
      });
    }

    function coletarDadosForm() {
      const dados = {};
      CAMPOS.forEach((c) => { dados[c] = document.getElementById(c).value; });
      return dados;
    }

    function formularioTemAlgumConteudo() {
      return CAMPOS.some((id) => document.getElementById(id) && document.getElementById(id).value.trim());
    }

    function formularioEstaCompleto() {
      return CAMPOS_OBRIGATORIOS.every((id) => document.getElementById(id) && document.getElementById(id).value.trim());
    }

    async function salvarVaga(modo, vagaOrigem) {
      const msg = document.getElementById('msg-vaga');
      msg.textContent = '';
      const dados = coletarDadosForm();

      if (modo === 'editar') dados.status = document.getElementById('status').value;
      dados.pesos = {
        tecnica: Number(document.getElementById('peso-tecnica').value) || 0,
        experiencia: Number(document.getElementById('peso-experiencia').value) || 0,
        entrevista: Number(document.getElementById('peso-entrevista').value) || 0,
      };
      sincronizarRequisitosDoDom();
      dados.requisitos_estruturados = formRequisitos;
      dados.campos_excluidos_score = [...CAMPOS_EXCLUIDOS_DEFAULT, ...formCamposExtras];

      try {
        const res = modo === 'editar'
          ? await apiFetch(`/people/api/vagas/${vagaOrigem.id}`, { method: 'PATCH', body: JSON.stringify(dados) })
          : await apiFetch('/people/api/vagas', { method: 'POST', body: JSON.stringify(dados) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Falha ao salvar vaga');
        fecharModal();
        carregarVagas();
      } catch (err) {
        msg.textContent = err.message;
      }
    }

    function tentarFecharVaga(modo) {
      if (modo === 'editar' || !formularioTemAlgumConteudo() || formularioEstaCompleto()) { fecharModal(); return; }
      confirmarSalvarRascunho(coletarDadosForm());
    }

    function confirmarSalvarRascunho(dados) {
      abrirModal(
        '<h3>Deseja salvar como rascunho?</h3>',
        `
          <p class="modal-texto">A vaga ainda não está completa. Pode salvar o que já foi preenchido como rascunho e continuar depois, ou descartar.</p>
          <div class="modal-erro" id="msg-rascunho"></div>
          <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="nao-salvar-rascunho">Não, descartar</button>
            <button type="button" class="btn" id="sim-salvar-rascunho">Sim, salvar rascunho</button>
          </div>
        `
      );
      document.getElementById('nao-salvar-rascunho').addEventListener('click', fecharModal);
      document.getElementById('sim-salvar-rascunho').addEventListener('click', async () => {
        if (!dados.nome || !dados.nome.trim()) {
          document.getElementById('msg-rascunho').textContent = 'Dê ao menos um nome pra vaga antes de salvar como rascunho.';
          return;
        }
        dados.rascunho = true;
        const res = await apiFetch('/people/api/vagas', { method: 'POST', body: JSON.stringify(dados) });
        const data = await res.json();
        if (!res.ok) { document.getElementById('msg-rascunho').textContent = data.error || 'Falha ao salvar rascunho'; return; }
        fecharModal();
        carregarVagas();
      });
    }

    function abrirModalVaga(vaga, modo) {
      formRequisitos = (vaga && vaga.requisitos_estruturados) ? JSON.parse(JSON.stringify(vaga.requisitos_estruturados)) : [];
      formCamposExtras = (vaga && vaga.campos_excluidos_score) ? vaga.campos_excluidos_score.filter((c) => !CAMPOS_EXCLUIDOS_DEFAULT.includes(c)) : [];

      const titulo = modo === 'editar' ? `Editando: ${vaga.nome}` : modo === 'duplicar' ? `Duplicar vaga: ${vaga.nome || vaga.nomeOriginal || ''}` : 'Nova vaga';
      abrirModal(`<h3>${titulo}</h3>`, `<form id="form-vaga">${formularioVaga(vaga, modo)}</form>`, 'modal-card-larga');

      renderizarRequisitos();
      renderizarCamposExcluidos();
      document.getElementById('btn-add-requisito').addEventListener('click', () => {
        sincronizarRequisitosDoDom();
        formRequisitos.push({ capacidade: '', categoria: 'tecnica', nivel_exigido: 'importante', peso: 0.5, anos_minimos: null });
        renderizarRequisitos();
      });
      document.getElementById('btn-add-campo-excluido').addEventListener('click', () => {
        const input = document.getElementById('novo-campo-excluido');
        const valor = input.value.trim();
        if (!valor || CAMPOS_EXCLUIDOS_DEFAULT.includes(valor) || formCamposExtras.includes(valor)) { input.value = ''; return; }
        formCamposExtras.push(valor);
        input.value = '';
        renderizarCamposExcluidos();
      });

      document.getElementById('btn-cancelar-vaga').addEventListener('click', () => tentarFecharVaga(modo));
      document.getElementById('form-vaga').addEventListener('submit', async (e) => {
        e.preventDefault();
        await salvarVaga(modo, vaga);
      });
    }

    async function abrirModalDuplicar(id) {
      const res = await apiFetch(`/people/api/vagas/${id}`);
      const vaga = await res.json();
      if (!res.ok) { avisar('Erro', vaga.error || 'Falha ao carregar vaga'); return; }
      abrirModalVaga({ ...vaga, nomeOriginal: vaga.nome, nome: '' }, 'duplicar');
    }

    function confirmarCancelarVaga(id, nome) {
      abrirModal(
        '<h3>Cancelar vaga</h3>',
        `
          <p class="modal-texto">Tem certeza que deseja cancelar a vaga${nome ? ` "${nome}"` : ''}? Ao realizar o cancelamento a rotina enviará uma notificação para todos os inscritos da vaga.</p>
          <div class="modal-erro" id="msg-cancelar-vaga"></div>
          <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="btn-sair-cancelar">Sair</button>
            <button type="button" class="btn btn-perigo" id="btn-confirmar-cancelar">Confirmar</button>
          </div>
        `
      );
      document.getElementById('btn-sair-cancelar').addEventListener('click', fecharModal);
      document.getElementById('btn-confirmar-cancelar').addEventListener('click', async () => {
        const res = await apiFetch(`/people/api/vagas/${id}/cancelar`, { method: 'POST' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { document.getElementById('msg-cancelar-vaga').textContent = data.error || 'Falha ao cancelar vaga'; return; }
        fecharModal();
        carregarVagas();
      });
    }

    document.getElementById('btn-nova-vaga').addEventListener('click', () => abrirModalVaga(null, 'criar'));

    // Os links de ação agora vivem dentro do menu "⋮" (por linha na lista,
    // por card nas colunas) — um único listener no document cobre as duas
    // visualizações em vez de um por container. Editar e Ver candidaturas
    // navegam pra tela cheia (vaga-editar.html / vaga-candidaturas.html),
    // não abrem mais modal.
    document.addEventListener('click', (e) => {
      const abrirBtn = e.target.closest('[data-abrir-menu]');
      if (abrirBtn) {
        e.preventDefault();
        e.stopPropagation();
        const painel = document.getElementById(`menu-acoes-${abrirBtn.dataset.abrirMenu}`);
        const jaAberto = !painel.hidden;
        fecharMenusAcoes();
        painel.hidden = jaAberto;
        return;
      }

      const editar = e.target.closest('[data-editar]');
      if (editar) { e.preventDefault(); window.location.href = `/people/vaga-editar.html?id=${editar.dataset.editar}`; return; }

      const duplicar = e.target.closest('[data-duplicar]');
      if (duplicar) { e.preventDefault(); fecharMenusAcoes(); abrirModalDuplicar(duplicar.dataset.duplicar); return; }

      const candidaturas = e.target.closest('[data-candidaturas]');
      if (candidaturas) { e.preventDefault(); window.location.href = `/people/vaga-candidaturas.html?id=${candidaturas.dataset.candidaturas}`; return; }

      const cancelar = e.target.closest('[data-cancelar]');
      if (cancelar) { e.preventDefault(); fecharMenusAcoes(); confirmarCancelarVaga(cancelar.dataset.cancelar, cancelar.dataset.nome); return; }

      const link = e.target.closest('[data-link]');
      if (link) {
        e.preventDefault();
        fecharMenusAcoes();
        const vaga = vagas.find((v) => v.id === link.dataset.link);
        if (vaga) copiarLink(vaga);
        return;
      }

      // Clicar na linha (Lista) ou no cartão (Quadro) abre a mesma edição
      // do menu "⋮" > Editar — já não chega aqui se o clique foi dentro do
      // menu-acoes (os `return` acima cobrem isso antes).
      const linhaVaga = e.target.closest('tr.linha-vaga');
      if (linhaVaga) { window.location.href = `/people/vaga-editar.html?id=${linhaVaga.dataset.id}`; return; }
      const cartaoVaga = e.target.closest('.cartao[data-cartao-vaga]');
      if (cartaoVaga) { window.location.href = `/people/vaga-editar.html?id=${cartaoVaga.dataset.cartaoVaga}`; return; }

      if (!e.target.closest('.menu-acoes-painel')) fecharMenusAcoes();
    });

    carregarVagas();
  </script>
</body>
</html>
