<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo People — Vagas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.setAttribute('data-tema', localStorage.getItem('people_tema') || 'claro');</script>
<link rel="stylesheet" href="/people/shell.css">
<style>
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media(max-width:520px) { .grid2 { grid-template-columns:1fr; } }
  .candidaturas-lista .item { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .candidaturas-lista .item:last-child { border-bottom:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips .badge { display:inline-flex; align-items:center; gap:2px; }
  .linha-requisito { display:grid; grid-template-columns:2fr 1fr 1fr 80px 90px 28px; gap:8px; align-items:center; margin-bottom:8px; }
  @media(max-width:700px) { .linha-requisito { grid-template-columns:1fr 1fr; } }

  .visualizacao-toggle { display:inline-flex; gap:4px; background:var(--surface-muted); border-radius:var(--radius-md); padding:4px; margin-bottom:16px; }
  .visualizacao-toggle button { background:transparent; color:var(--muted-strong); border:none; border-radius:8px;
    padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; height:auto; margin:0; }
  .visualizacao-toggle button.ativo { background:var(--card); color:var(--text); box-shadow:0 1px 2px rgba(15,17,26,.08); }

  .menu-acoes { position:relative; display:inline-block; }
  .menu-acoes-btn { background:transparent; color:var(--muted); width:32px; height:32px; padding:0; margin:0;
    border-radius:8px; display:inline-flex; align-items:center; justify-content:center; }
  .menu-acoes-btn:hover { background:var(--surface-muted); color:var(--text); }
  .menu-acoes-painel { position:absolute; top:calc(100% + 4px); right:0; min-width:180px; background:var(--card);
    border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:0 12px 32px rgba(15,17,26,.12); padding:6px; z-index:40; }
  .menu-acoes-painel a { display:block; padding:8px 10px; border-radius:8px; font-size:13px; color:var(--text-secondary); text-decoration:none; }
  .menu-acoes-painel a:hover { background:var(--surface-muted); }

  .kanban-vagas { display:grid; grid-template-columns:repeat(5, minmax(220px, 1fr)); gap:14px; align-items:start; overflow-x:auto; padding-bottom:8px; }
  .kanban-coluna { display:flex; flex-direction:column; gap:10px; min-width:0; }
  .kanban-coluna-titulo { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); padding:0 2px; }
  .card-vaga { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; }
  .card-vaga-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-vaga-nome { font-size:13.5px; font-weight:700; color:var(--text); }
  .card-vaga-data { font-size:11.5px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
  <header class="topo-app">
    <a class="topo-logo" href="/people/painel.html" aria-label="Ir para o início">
      <img class="topo-logo-img" src="/people/images/logo-kyvvo.svg" alt="Kyvvo">
      <span class="topo-produto-tag">People</span>
    </a>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar js-avatar-usuario"></div>
        <span class="nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <a class="menu-perfil-item" href="/people/configuracoes.html">
          <span data-icon="settings" data-size="16"></span><span class="rotulo">Configurações</span>
        </a>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
  </header>
  <div class="app-shell">
    <div class="sidebar-wrap">
      <aside class="painel-sidebar" id="painel-sidebar">
      <nav class="grupo-menu">
        <div class="grupo-titulo">Seleção</div>
        <a class="menu-item" href="/people/painel.html"><span data-icon="layout-dashboard"></span><span class="rotulo">Visão geral</span></a>
        <a class="menu-item" href="/people/vagas.html"><span data-icon="briefcase"></span><span class="rotulo">Vagas</span></a>
        <a class="menu-item" href="/people/candidatos.html"><span data-icon="users"></span><span class="rotulo">Candidatos</span></a>
        <a class="menu-item" href="/people/avaliacoes.html"><span data-icon="brain"></span><span class="rotulo">Avaliações</span></a>
      </nav>
      <nav class="grupo-menu">
        <div class="grupo-titulo">Gestão</div>
        <a class="menu-item" href="/people/quadro.html"><span data-icon="kanban"></span><span class="rotulo">Quadro</span></a>
        <a class="menu-item" href="/people/whatsapp.html"><span data-icon="message-circle"></span><span class="rotulo">WhatsApp</span></a>
        <a class="menu-item" href="/people/configuracoes.html"><span data-icon="settings"></span><span class="rotulo">Configurações</span></a>
      </nav>
      </aside>
      <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" type="button" aria-label="Ocultar menu" title="Ocultar menu">&lt;</button>
    </div>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Vagas</h1></div>
        </div>
        <div class="acoes">
          <button class="btn" id="btn-nova-vaga" type="button"><span data-icon="plus" data-size="16"></span>Nova vaga</button>
        </div>
      </div>

      <div class="visualizacao-toggle" id="visualizacao-toggle">
        <button type="button" data-vis="lista">Lista</button>
        <button type="button" data-vis="kanban">Colunas</button>
      </div>

      <div id="vista-lista">
        <div class="card" style="padding:0">
          <table>
            <thead>
              <tr>
                <th>Nome vaga</th>
                <th>Status</th>
                <th>Total de candidatos</th>
                <th>Total em andamento</th>
                <th>Criada em</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabela-vagas"></tbody>
          </table>
        </div>
      </div>
      <div id="vista-kanban" hidden>
        <div class="kanban-vagas" id="kanban-vagas"></div>
      </div>
    </div>
  </div>

  <footer class="rodape-logado">
    <img src="/people/images/logo-kyvvo.svg" alt="Kyvvo">
    <span>© 2026 Kyvvo Tecnologia. Todos os direitos reservados.</span>
  </footer>

  <script src="/people/shell.js"></script>
  <script>
    const STATUS_CLASSE = { rascunho: 'neutro', nova: 'destaque', em_andamento: 'aviso', pausada: 'aviso', encerrada: 'neutro' };
    const STATUS_LABEL = { rascunho: 'Rascunho', nova: 'Nova', em_andamento: 'Em andamento', pausada: 'Pausada', encerrada: 'Encerrada' };
    const CAMPOS = ['codigo', 'nome', 'descricao', 'salario', 'modalidade', 'nivel_experiencia', 'cargo', 'requisitos', 'competencias'];
    const CAMPOS_OBRIGATORIOS = ['nome', 'descricao', 'nivel_experiencia', 'cargo', 'requisitos', 'competencias'];
    const CAMPOS_EXCLUIDOS_DEFAULT = ['idade', 'ano_formatura', 'genero', 'estado_civil', 'nome', 'foto', 'endereco_completo', 'gaps_temporais_nao_justificados'];

    let formRequisitos = [];
    let formCamposExtras = [];
    let vagas = [];
    let visualizacao = localStorage.getItem('people_vagas_visualizacao') === 'kanban' ? 'kanban' : 'lista';
    const STATUS_ORDEM = ['rascunho', 'nova', 'em_andamento', 'pausada', 'encerrada'];

    function menuAcoesHtml(v) {
      return `
        <div class="menu-acoes">
          <button class="menu-acoes-btn" type="button" data-abrir-menu="${v.id}" aria-label="Ações" title="Ações">${icon('menu', 18)}</button>
          <div class="menu-acoes-painel" id="menu-acoes-${v.id}" hidden>
            <a href="#" data-editar="${v.id}">Editar</a>
            <a href="#" data-duplicar="${v.id}">Duplicar</a>
            <a href="#" data-candidaturas="${v.id}" data-nome="${v.nome}">Ver candidaturas</a>
            <a href="#" data-link="${v.id}">Copiar link</a>
          </div>
        </div>
      `;
    }

    function fecharMenusAcoes() {
      document.querySelectorAll('.menu-acoes-painel').forEach((p) => { p.hidden = true; });
    }

    function aplicarVisualizacao() {
      document.getElementById('vista-lista').hidden = visualizacao !== 'lista';
      document.getElementById('vista-kanban').hidden = visualizacao !== 'kanban';
      document.querySelectorAll('#visualizacao-toggle button').forEach((b) => b.classList.toggle('ativo', b.dataset.vis === visualizacao));
    }

    function renderizar() {
      if (visualizacao === 'kanban') renderizarKanban(); else renderizarLista();
    }

    function renderizarLista() {
      const corpo = document.getElementById('tabela-vagas');
      corpo.innerHTML = vagas.map((v) => `
        <tr>
          <td>${v.status === 'rascunho' ? '<span class="badge neutro" style="margin-right:6px">Rascunho</span>' : ''}${v.nome}</td>
          <td><span class="badge ${STATUS_CLASSE[v.status]}">${STATUS_LABEL[v.status]}</span></td>
          <td>${v.total_candidatos}</td>
          <td>${v.total_em_andamento}</td>
          <td>${new Date(v.criado_em).toLocaleDateString('pt-BR')}</td>
          <td>${menuAcoesHtml(v)}</td>
        </tr>
      `).join('') || '<tr><td colspan="6" class="vazio">Nenhuma vaga cadastrada ainda.</td></tr>';
    }

    function renderizarKanban() {
      const container = document.getElementById('kanban-vagas');
      container.innerHTML = STATUS_ORDEM.map((status) => {
        const doStatus = vagas.filter((v) => v.status === status);
        return `
          <div class="kanban-coluna">
            <div class="kanban-coluna-titulo">${STATUS_LABEL[status]} (${doStatus.length})</div>
            ${doStatus.map((v) => `
              <div class="card-vaga">
                <div class="card-vaga-topo">
                  <span class="card-vaga-nome">${v.nome}</span>
                  ${menuAcoesHtml(v)}
                </div>
                <div class="card-vaga-data">${new Date(v.criado_em).toLocaleDateString('pt-BR')}</div>
              </div>
            `).join('') || '<p class="campo-ajuda">Nenhuma vaga.</p>'}
          </div>
        `;
      }).join('');
    }

    document.getElementById('visualizacao-toggle').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-vis]');
      if (!btn) return;
      visualizacao = btn.dataset.vis;
      localStorage.setItem('people_vagas_visualizacao', visualizacao);
      aplicarVisualizacao();
      renderizar();
    });

    async function carregarVagas() {
      const res = await apiFetch('/people/api/vagas');
      vagas = await res.json();
      aplicarVisualizacao();
      renderizar();
    }

    async function copiarLink(vaga) {
      const url = `${window.location.origin}/people/vaga/${vaga.id}`;
      try {
        await navigator.clipboard.writeText(url);
        avisar('Link copiado', url);
      } catch {
        avisar('Não foi possível copiar automaticamente', `Copie manualmente: ${url}`);
      }
      if (vaga.status === 'nova') {
        await apiFetch(`/people/api/vagas/${vaga.id}`, { method: 'PATCH', body: JSON.stringify({ status: 'em_andamento' }) });
        vaga.status = 'em_andamento';
        renderizar();
      }
    }

    function formularioVaga(vaga, modo) {
      const v = vaga || {};
      const editando = modo === 'editar';
      const mostrarAvancado = modo !== 'criar';
      const limites = v.limites || { max_eliminatorios: 3 };
      return `
        <div class="modal-erro" id="msg-vaga"></div>
        <div class="grid2">
          <div><label for="codigo">Código da vaga</label><input id="codigo" value="${v.codigo || ''}"></div>
          <div><label for="nome">Nome da vaga *</label><input id="nome" required value="${v.nome || ''}"></div>
        </div>
        <label for="descricao">Descrição *</label>
        <textarea id="descricao">${v.descricao || ''}</textarea>
        <div class="grid2">
          <div>
            <label for="salario">Salário</label>
            <input id="salario" placeholder="Ex: A combinar, R$ 3.000 a R$ 4.000" value="${v.salario || ''}">
          </div>
          <div>
            <label for="modalidade">Modalidade</label>
            <select id="modalidade">
              <option value="" ${!v.modalidade ? 'selected' : ''}>Selecione</option>
              <option ${v.modalidade === 'Presencial' ? 'selected' : ''}>Presencial</option>
              <option ${v.modalidade === 'Remoto' ? 'selected' : ''}>Remoto</option>
              <option ${v.modalidade === 'Híbrido' ? 'selected' : ''}>Híbrido</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="nivel_experiencia">Nível de experiência *</label>
            <input id="nivel_experiencia" placeholder="Ex: Júnior, Pleno, Sênior" value="${v.nivel_experiencia || ''}">
          </div>
          <div><label for="cargo">Cargo *</label><input id="cargo" value="${v.cargo || ''}"></div>
        </div>
        <label for="requisitos">Requisitos *</label>
        <textarea id="requisitos">${v.requisitos || ''}</textarea>
        <label for="competencias">Competências *</label>
        <textarea id="competencias">${v.competencias || ''}</textarea>
        ${editando ? `
          <label for="status">Status</label>
          <select id="status">
            <option value="rascunho" ${v.status === 'rascunho' ? 'selected' : ''}>Rascunho</option>
            <option value="nova" ${v.status === 'nova' ? 'selected' : ''}>Nova</option>
            <option value="em_andamento" ${v.status === 'em_andamento' ? 'selected' : ''}>Em andamento</option>
            <option value="pausada" ${v.status === 'pausada' ? 'selected' : ''}>Pausada</option>
            <option value="encerrada" ${v.status === 'encerrada' ? 'selected' : ''}>Encerrada</option>
          </select>
        ` : ''}
        ${mostrarAvancado ? `
          <label>Pesos do score de aderência</label>
          <p class="campo-ajuda">Usados quando a psicóloga lança nota (0-100) em cada componente da candidatura — o "geral" é a média ponderada por esses pesos.</p>
          <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
            <div><label for="peso-tecnica">Técnica</label><input id="peso-tecnica" type="number" step="0.05" min="0" max="1" value="${(v.pesos && v.pesos.tecnica) ?? 0.4}"></div>
            <div><label for="peso-experiencia">Experiência</label><input id="peso-experiencia" type="number" step="0.05" min="0" max="1" value="${(v.pesos && v.pesos.experiencia) ?? 0.4}"></div>
            <div><label for="peso-entrevista">Entrevista</label><input id="peso-entrevista" type="number" step="0.05" min="0" max="1" value="${(v.pesos && v.pesos.entrevista) ?? 0.2}"></div>
          </div>

          <label>Requisitos estruturados (motor de match)</label>
          <p class="campo-ajuda">Fundação pro cálculo automático de aderência — hoje só grava os dados; o cálculo em si ainda é manual (lançar score no candidato).</p>
          <div id="lista-requisitos-estruturados"></div>
          <button type="button" class="btn-secundario" id="btn-add-requisito" style="margin:4px 0 8px">+ Adicionar requisito</button>

          <label for="max-eliminatorios">Máximo de requisitos eliminatórios</label>
          <input id="max-eliminatorios" type="number" min="1" max="10" value="${limites.max_eliminatorios ?? 3}" style="max-width:120px">

          <label>Campos excluídos do score</label>
          <p class="campo-ajuda">Nunca entram no cálculo de aderência — a lista padrão não pode ser removida, só ampliada.</p>
          <div id="lista-campos-excluidos" class="chips"></div>
          <div class="campo-arquivo" style="margin-top:8px">
            <input id="novo-campo-excluido" placeholder="Ex: nome_da_faculdade" style="flex:1">
            <button type="button" class="btn-secundario" id="btn-add-campo-excluido">Adicionar</button>
          </div>
        ` : ''}
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar-vaga">Cancelar</button>
          <button type="submit" class="btn">${editando ? 'Salvar alterações' : 'Criar vaga'}</button>
        </div>
      `;
    }

    function renderizarRequisitos() {
      const el = document.getElementById('lista-requisitos-estruturados');
      el.innerHTML = formRequisitos.map((r, i) => `
        <div class="linha-requisito" data-i="${i}">
          <input class="req-capacidade" placeholder="Capacidade (ex: Controladoria)" value="${r.capacidade || ''}">
          <select class="req-categoria">
            <option value="tecnica" ${r.categoria === 'tecnica' ? 'selected' : ''}>Técnica</option>
            <option value="experiencia" ${r.categoria === 'experiencia' ? 'selected' : ''}>Experiência</option>
            <option value="idioma" ${r.categoria === 'idioma' ? 'selected' : ''}>Idioma</option>
            <option value="comportamental" ${r.categoria === 'comportamental' ? 'selected' : ''}>Comportamental</option>
          </select>
          <select class="req-nivel">
            <option value="eliminatorio" ${r.nivel_exigido === 'eliminatorio' ? 'selected' : ''}>Eliminatório</option>
            <option value="importante" ${r.nivel_exigido === 'importante' ? 'selected' : ''}>Importante</option>
            <option value="desejavel" ${r.nivel_exigido === 'desejavel' ? 'selected' : ''}>Desejável</option>
          </select>
          <input class="req-peso" type="number" step="0.1" min="0" max="1" value="${r.peso ?? 0.5}" title="Peso">
          <input class="req-anos" type="number" min="0" step="1" placeholder="Anos mín." value="${r.anos_minimos ?? ''}" title="Anos mínimos (só experiência)">
          <button type="button" class="btn-remover-requisito" data-i="${i}" title="Remover" style="background:transparent;color:var(--danger);padding:0">${icon('x', 16)}</button>
        </div>
      `).join('') || '<p class="campo-ajuda">Nenhum requisito estruturado ainda.</p>';

      el.querySelectorAll('.btn-remover-requisito').forEach((btn) => {
        btn.addEventListener('click', () => {
          sincronizarRequisitosDoDom();
          formRequisitos.splice(Number(btn.dataset.i), 1);
          renderizarRequisitos();
        });
      });
    }

    function sincronizarRequisitosDoDom() {
      const el = document.getElementById('lista-requisitos-estruturados');
      if (!el) return;
      el.querySelectorAll('.linha-requisito').forEach((linha, i) => {
        formRequisitos[i] = {
          ...formRequisitos[i],
          capacidade: linha.querySelector('.req-capacidade').value,
          categoria: linha.querySelector('.req-categoria').value,
          nivel_exigido: linha.querySelector('.req-nivel').value,
          peso: Number(linha.querySelector('.req-peso').value) || 0,
          anos_minimos: linha.querySelector('.req-anos').value ? Number(linha.querySelector('.req-anos').value) : null,
        };
      });
    }

    function renderizarCamposExcluidos() {
      const el = document.getElementById('lista-campos-excluidos');
      el.innerHTML = [
        ...CAMPOS_EXCLUIDOS_DEFAULT.map((c) => `<span class="badge neutro" title="Padrão fixo, não pode ser removido">${c}</span>`),
        ...formCamposExtras.map((c, i) => `<span class="badge aviso">${c} <button type="button" class="btn-remover-campo-excluido" data-i="${i}" style="background:transparent;border:none;color:inherit;cursor:pointer;padding:0 0 0 4px">×</button></span>`),
      ].join(' ');
      el.querySelectorAll('.btn-remover-campo-excluido').forEach((btn) => {
        btn.addEventListener('click', () => {
          formCamposExtras.splice(Number(btn.dataset.i), 1);
          renderizarCamposExcluidos();
        });
      });
    }

    function coletarDadosForm() {
      const dados = {};
      CAMPOS.forEach((c) => { dados[c] = document.getElementById(c).value; });
      return dados;
    }

    function formularioTemAlgumConteudo() {
      return CAMPOS.some((id) => document.getElementById(id) && document.getElementById(id).value.trim());
    }

    function formularioEstaCompleto() {
      return CAMPOS_OBRIGATORIOS.every((id) => document.getElementById(id) && document.getElementById(id).value.trim());
    }

    async function salvarVaga(modo, vagaOrigem) {
      const msg = document.getElementById('msg-vaga');
      msg.textContent = '';
      const dados = coletarDadosForm();

      if (modo === 'editar') dados.status = document.getElementById('status').value;
      if (modo !== 'criar') {
        dados.pesos = {
          tecnica: Number(document.getElementById('peso-tecnica').value) || 0,
          experiencia: Number(document.getElementById('peso-experiencia').value) || 0,
          entrevista: Number(document.getElementById('peso-entrevista').value) || 0,
        };
        sincronizarRequisitosDoDom();
        dados.requisitos_estruturados = formRequisitos;
        dados.limites = { max_eliminatorios: Number(document.getElementById('max-eliminatorios').value) || 3 };
        dados.campos_excluidos_score = [...CAMPOS_EXCLUIDOS_DEFAULT, ...formCamposExtras];
      }

      try {
        const res = modo === 'editar'
          ? await apiFetch(`/people/api/vagas/${vagaOrigem.id}`, { method: 'PATCH', body: JSON.stringify(dados) })
          : await apiFetch('/people/api/vagas', { method: 'POST', body: JSON.stringify(dados) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Falha ao salvar vaga');
        fecharModal();
        carregarVagas();
      } catch (err) {
        msg.textContent = err.message;
      }
    }

    function tentarFecharVaga(modo) {
      if (modo === 'editar' || !formularioTemAlgumConteudo() || formularioEstaCompleto()) { fecharModal(); return; }
      confirmarSalvarRascunho(coletarDadosForm());
    }

    function confirmarSalvarRascunho(dados) {
      abrirModal(
        '<h3>Deseja salvar como rascunho?</h3>',
        `
          <p class="modal-texto">A vaga ainda não está completa. Pode salvar o que já foi preenchido como rascunho e continuar depois, ou descartar.</p>
          <div class="modal-erro" id="msg-rascunho"></div>
          <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="nao-salvar-rascunho">Não, descartar</button>
            <button type="button" class="btn" id="sim-salvar-rascunho">Sim, salvar rascunho</button>
          </div>
        `
      );
      document.getElementById('nao-salvar-rascunho').addEventListener('click', fecharModal);
      document.getElementById('sim-salvar-rascunho').addEventListener('click', async () => {
        if (!dados.nome || !dados.nome.trim()) {
          document.getElementById('msg-rascunho').textContent = 'Dê ao menos um nome pra vaga antes de salvar como rascunho.';
          return;
        }
        dados.rascunho = true;
        const res = await apiFetch('/people/api/vagas', { method: 'POST', body: JSON.stringify(dados) });
        const data = await res.json();
        if (!res.ok) { document.getElementById('msg-rascunho').textContent = data.error || 'Falha ao salvar rascunho'; return; }
        fecharModal();
        carregarVagas();
      });
    }

    function abrirModalVaga(vaga, modo) {
      formRequisitos = (vaga && vaga.requisitos_estruturados) ? JSON.parse(JSON.stringify(vaga.requisitos_estruturados)) : [];
      formCamposExtras = (vaga && vaga.campos_excluidos_score) ? vaga.campos_excluidos_score.filter((c) => !CAMPOS_EXCLUIDOS_DEFAULT.includes(c)) : [];

      const titulo = modo === 'editar' ? `Editando: ${vaga.nome}` : modo === 'duplicar' ? `Duplicar vaga: ${vaga.nome || vaga.nomeOriginal || ''}` : 'Nova vaga';
      abrirModal(`<h3>${titulo}</h3>`, `<form id="form-vaga">${formularioVaga(vaga, modo)}</form>`, 'modal-card-larga');

      if (modo !== 'criar') {
        renderizarRequisitos();
        renderizarCamposExcluidos();
        document.getElementById('btn-add-requisito').addEventListener('click', () => {
          sincronizarRequisitosDoDom();
          formRequisitos.push({ capacidade: '', categoria: 'tecnica', nivel_exigido: 'importante', peso: 0.5, anos_minimos: null });
          renderizarRequisitos();
        });
        document.getElementById('btn-add-campo-excluido').addEventListener('click', () => {
          const input = document.getElementById('novo-campo-excluido');
          const valor = input.value.trim();
          if (!valor || CAMPOS_EXCLUIDOS_DEFAULT.includes(valor) || formCamposExtras.includes(valor)) { input.value = ''; return; }
          formCamposExtras.push(valor);
          input.value = '';
          renderizarCamposExcluidos();
        });
      }

      document.getElementById('btn-cancelar-vaga').addEventListener('click', () => tentarFecharVaga(modo));
      document.getElementById('form-vaga').addEventListener('submit', async (e) => {
        e.preventDefault();
        await salvarVaga(modo, vaga);
      });
    }

    async function abrirModalEditar(id) {
      const res = await apiFetch(`/people/api/vagas/${id}`);
      const vaga = await res.json();
      if (!res.ok) { alert(vaga.error || 'Falha ao carregar vaga'); return; }
      abrirModalVaga(vaga, 'editar');
    }

    async function abrirModalDuplicar(id) {
      const res = await apiFetch(`/people/api/vagas/${id}`);
      const vaga = await res.json();
      if (!res.ok) { alert(vaga.error || 'Falha ao carregar vaga'); return; }
      abrirModalVaga({ ...vaga, nomeOriginal: vaga.nome, nome: '' }, 'duplicar');
    }

    async function abrirModalCandidaturas(id, nome) {
      abrirModal(`<h3>Candidaturas — ${nome}</h3>`, '<div class="candidaturas-lista" id="lista-candidaturas">Carregando...</div>', 'modal-card-larga');
      const res = await apiFetch(`/people/api/vagas/${id}/candidaturas`);
      const candidaturas = await res.json();
      document.getElementById('lista-candidaturas').innerHTML = candidaturas.map((c) => `
        <div class="item">
          <span>${c.nome} — ${c.whatsapp} — ${c.email}${c.linkedin ? ` — <a class="acao" href="${c.linkedin}" target="_blank">LinkedIn</a>` : ''}</span>
          <a class="acao" href="#" data-curriculo="${c.id}">Baixar currículo</a>
        </div>
      `).join('') || '<div class="vazio">Nenhuma candidatura recebida ainda.</div>';
    }

    document.getElementById('btn-nova-vaga').addEventListener('click', () => abrirModalVaga(null, 'criar'));

    // Os links de ação agora vivem dentro do menu sanduíche (por linha na
    // lista, por card nas colunas) — um único listener no document cobre
    // as duas visualizações em vez de um por container.
    document.addEventListener('click', (e) => {
      const abrirBtn = e.target.closest('[data-abrir-menu]');
      if (abrirBtn) {
        e.preventDefault();
        e.stopPropagation();
        const painel = document.getElementById(`menu-acoes-${abrirBtn.dataset.abrirMenu}`);
        const jaAberto = !painel.hidden;
        fecharMenusAcoes();
        painel.hidden = jaAberto;
        return;
      }

      const editar = e.target.closest('[data-editar]');
      if (editar) { e.preventDefault(); fecharMenusAcoes(); abrirModalEditar(editar.dataset.editar); return; }

      const duplicar = e.target.closest('[data-duplicar]');
      if (duplicar) { e.preventDefault(); fecharMenusAcoes(); abrirModalDuplicar(duplicar.dataset.duplicar); return; }

      const candidaturas = e.target.closest('[data-candidaturas]');
      if (candidaturas) { e.preventDefault(); fecharMenusAcoes(); abrirModalCandidaturas(candidaturas.dataset.candidaturas, candidaturas.dataset.nome); return; }

      const link = e.target.closest('[data-link]');
      if (link) {
        e.preventDefault();
        fecharMenusAcoes();
        const vaga = vagas.find((v) => v.id === link.dataset.link);
        if (vaga) copiarLink(vaga);
        return;
      }

      if (!e.target.closest('.menu-acoes-painel')) fecharMenusAcoes();
    });

    document.addEventListener('click', async (e) => {
      const alvo = e.target.closest('[data-curriculo]');
      if (!alvo) return;
      e.preventDefault();
      const res = await apiFetch(`/people/api/candidaturas/${alvo.dataset.curriculo}/curriculo`);
      if (!res.ok) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'curriculo';
      a.click();
      URL.revokeObjectURL(url);
    });

    carregarVagas();
  </script>
</body>
</html>
