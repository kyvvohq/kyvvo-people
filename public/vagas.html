<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo People — Vagas</title>
<link rel="stylesheet" href="/people/shell.css">
<style>
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media(max-width:520px) { .grid2 { grid-template-columns:1fr; } }
  .candidaturas-lista .item { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .candidaturas-lista .item:last-child { border-bottom:none; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="/people/painel.html" aria-label="Ir para o início">ky<span>vv</span>o people</a>
    <div class="user-menu" id="user-menu">
      <button class="user-menu-toggle" id="user-menu-toggle" type="button">
        <div class="user-menu-avatar" id="user-menu-avatar"></div>
        <div class="user-menu-textos">
          <div class="user-menu-nome" id="user-menu-nome"></div>
          <div class="user-menu-empresa">Kyvvo People</div>
        </div>
        <span class="user-menu-chevron">▾</span>
      </button>
      <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
        <button class="user-menu-sair" id="btn-sair" type="button"><span aria-hidden="true">⎋</span> Sair</button>
      </div>
    </div>
  </div>
  <div class="painel-shell">
    <aside class="painel-sidebar" id="painel-sidebar">
      <nav class="menu">
        <a class="menu-item" href="/people/painel.html">Início</a>
        <a class="menu-item" href="/people/vagas.html">Vagas</a>
        <a class="menu-item" href="/people/candidatos.html">Candidatos</a>
        <a class="menu-item" href="/people/quadro.html">Quadro</a>
        <a class="menu-item" href="/people/whatsapp.html">WhatsApp</a>
        <a class="menu-item" href="/people/configuracoes.html">Configurações</a>
      </nav>
    </aside>
    <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" aria-label="Ocultar menu" title="Ocultar menu" type="button">&lt;</button>
    <div class="painel-main">
      <div class="conteudo">
        <div class="cabecalho-pagina">
          <h1>Vagas</h1>
          <button class="btn" id="btn-nova-vaga" type="button">+ Nova vaga</button>
        </div>

        <div class="card">
          <table>
            <thead><tr><th>Nome</th><th>Cargo</th><th>Status</th><th>Criada em</th><th></th></tr></thead>
            <tbody id="tabela-vagas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <footer class="rodape-app">
    <p class="rodape-app-copy">© 2026 <img src="/people/images/logo-kyvvo.svg" alt="Kyvvo" class="rodape-logo-img">. Todos os direitos reservados.</p>
  </footer>

  <script src="/people/shell.js"></script>
  <script>
    const STATUS_LABEL = { nova: 'Nova', em_andamento: 'Em andamento', pausada: 'Pausada', encerrada: 'Encerrada' };
    const CAMPOS = ['codigo', 'nome', 'descricao', 'salario', 'modalidade', 'nivel_experiencia', 'cargo', 'requisitos', 'competencias'];

    async function carregarVagas() {
      const res = await apiFetch('/people/api/vagas');
      const vagas = await res.json();
      const corpo = document.getElementById('tabela-vagas');
      corpo.innerHTML = vagas.map((v) => `
        <tr>
          <td>${v.nome}</td>
          <td>${v.cargo}</td>
          <td><span class="badge ${v.status}">${STATUS_LABEL[v.status]}</span></td>
          <td>${new Date(v.criado_em).toLocaleDateString('pt-BR')}</td>
          <td>
            <a class="acao" href="#" data-editar="${v.id}">Editar</a>
            <a class="acao" href="#" data-candidaturas="${v.id}" data-nome="${v.nome}">Ver candidaturas</a>
            <a class="acao" href="#" data-link="${v.id}">Copiar link</a>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="vazio">Nenhuma vaga cadastrada ainda.</td></tr>';
    }

    function formularioVaga(vaga) {
      const v = vaga || {};
      return `
        <div class="modal-erro" id="msg-vaga"></div>
        <div class="grid2">
          <div><label for="codigo">Código da vaga</label><input id="codigo" value="${v.codigo || ''}"></div>
          <div><label for="nome">Nome da vaga *</label><input id="nome" required value="${v.nome || ''}"></div>
        </div>
        <label for="descricao">Descrição *</label>
        <textarea id="descricao" required>${v.descricao || ''}</textarea>
        <div class="grid2">
          <div>
            <label for="salario">Salário</label>
            <input id="salario" placeholder="Ex: A combinar, R$ 3.000 a R$ 4.000" value="${v.salario || ''}">
          </div>
          <div>
            <label for="modalidade">Modalidade</label>
            <select id="modalidade">
              <option value="" ${!v.modalidade ? 'selected' : ''}>Selecione</option>
              <option ${v.modalidade === 'Presencial' ? 'selected' : ''}>Presencial</option>
              <option ${v.modalidade === 'Remoto' ? 'selected' : ''}>Remoto</option>
              <option ${v.modalidade === 'Híbrido' ? 'selected' : ''}>Híbrido</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="nivel_experiencia">Nível de experiência *</label>
            <input id="nivel_experiencia" placeholder="Ex: Júnior, Pleno, Sênior" required value="${v.nivel_experiencia || ''}">
          </div>
          <div><label for="cargo">Cargo *</label><input id="cargo" required value="${v.cargo || ''}"></div>
        </div>
        <label for="requisitos">Requisitos *</label>
        <textarea id="requisitos" required>${v.requisitos || ''}</textarea>
        <label for="competencias">Competências *</label>
        <textarea id="competencias" required>${v.competencias || ''}</textarea>
        ${vaga ? `
          <label for="status">Status</label>
          <select id="status">
            <option value="nova" ${v.status === 'nova' ? 'selected' : ''}>Nova</option>
            <option value="em_andamento" ${v.status === 'em_andamento' ? 'selected' : ''}>Em andamento</option>
            <option value="pausada" ${v.status === 'pausada' ? 'selected' : ''}>Pausada</option>
            <option value="encerrada" ${v.status === 'encerrada' ? 'selected' : ''}>Encerrada</option>
          </select>
        ` : ''}
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btn-cancelar-vaga">Cancelar</button>
          <button type="submit" class="btn">${vaga ? 'Salvar alterações' : 'Criar vaga'}</button>
        </div>
      `;
    }

    function abrirModalVaga(vaga) {
      abrirModal(
        `<h3>${vaga ? `Editando: ${vaga.nome}` : 'Nova vaga'}</h3>`,
        `<form id="form-vaga">${formularioVaga(vaga)}</form>`,
        'modal-card-larga'
      );

      document.getElementById('btn-cancelar-vaga').addEventListener('click', fecharModal);
      document.getElementById('form-vaga').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('msg-vaga');
        msg.textContent = '';
        const dados = {};
        CAMPOS.forEach((c) => { dados[c] = document.getElementById(c).value; });

        try {
          let res;
          if (vaga) {
            dados.status = document.getElementById('status').value;
            res = await apiFetch(`/people/api/vagas/${vaga.id}`, { method: 'PATCH', body: JSON.stringify(dados) });
          } else {
            res = await apiFetch('/people/api/vagas', { method: 'POST', body: JSON.stringify(dados) });
          }
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Falha ao salvar vaga');
          fecharModal();
          carregarVagas();
        } catch (err) {
          msg.textContent = err.message;
        }
      });
    }

    async function abrirModalEditar(id) {
      const res = await apiFetch(`/people/api/vagas/${id}`);
      const vaga = await res.json();
      if (!res.ok) { alert(vaga.error || 'Falha ao carregar vaga'); return; }
      abrirModalVaga(vaga);
    }

    async function abrirModalCandidaturas(id, nome) {
      abrirModal(`<h3>Candidaturas — ${nome}</h3>`, '<div class="candidaturas-lista" id="lista-candidaturas">Carregando...</div>', 'modal-card-larga');
      const res = await apiFetch(`/people/api/vagas/${id}/candidaturas`);
      const candidaturas = await res.json();
      document.getElementById('lista-candidaturas').innerHTML = candidaturas.map((c) => `
        <div class="item">
          <span>${c.nome} — ${c.whatsapp} — ${c.email}${c.linkedin ? ` — <a class="acao" href="${c.linkedin}" target="_blank">LinkedIn</a>` : ''}</span>
          <a class="acao" href="#" data-curriculo="${c.id}">Baixar currículo</a>
        </div>
      `).join('') || '<div class="vazio">Nenhuma candidatura recebida ainda.</div>';
    }

    document.getElementById('btn-nova-vaga').addEventListener('click', () => abrirModalVaga(null));

    document.getElementById('tabela-vagas').addEventListener('click', (e) => {
      const editar = e.target.closest('[data-editar]');
      if (editar) { e.preventDefault(); abrirModalEditar(editar.dataset.editar); return; }

      const candidaturas = e.target.closest('[data-candidaturas]');
      if (candidaturas) { e.preventDefault(); abrirModalCandidaturas(candidaturas.dataset.candidaturas, candidaturas.dataset.nome); return; }

      const link = e.target.closest('[data-link]');
      if (link) {
        e.preventDefault();
        const url = `${window.location.origin}/people/vaga/${link.dataset.link}`;
        navigator.clipboard.writeText(url).then(() => alert(`Link copiado:\n${url}`));
      }
    });

    document.addEventListener('click', async (e) => {
      const alvo = e.target.closest('[data-curriculo]');
      if (!alvo) return;
      e.preventDefault();
      const res = await apiFetch(`/people/api/candidaturas/${alvo.dataset.curriculo}/curriculo`);
      if (!res.ok) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'curriculo';
      a.click();
      URL.revokeObjectURL(url);
    });

    carregarVagas();
  </script>
</body>
</html>
