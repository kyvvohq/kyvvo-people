<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaga — Kyvvo People</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#F8F9FC; color:#0F111A; font-family:'Inter',Arial,Helvetica,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 24px 80px; }
  .logo { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .logo .marca-k { width:28px; height:28px; border-radius:8px; background:#0F111A; color:#fff;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .logo .nome { font-size:15px; font-weight:700; }
  .card { background:#fff; border:1px solid #E7EAF2; border-radius:16px; padding:28px; margin-bottom:24px; }
  h1 { font-family:'Space Grotesk',sans-serif; font-size:20px; margin:0 0 8px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .pill { font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; background:#F1F3F8; color:#2B3040; }
  h2 { font-size:13px; color:#6B7385; text-transform:uppercase; letter-spacing:.04em; margin:20px 0 8px; }
  h2:first-of-type { margin-top:0; }
  p.corpo { font-size:14px; line-height:1.7; color:#2B3040; white-space:pre-line; margin:0; }
  label.campo { display:block; font-size:13px; font-weight:600; color:#2B3040; margin:16px 0 7px; }
  input[type=text], input[type=email] { width:100%; box-sizing:border-box; background:#fff; border:1px solid #D7DCE8;
    border-radius:12px; height:44px; padding:0 14px; color:#0F111A; font-size:14px; font-family:inherit; }
  input[type=file] { width:100%; box-sizing:border-box; background:#F8F9FC; border:1px dashed #D7DCE8;
    border-radius:12px; padding:12px; color:#6B7385; font-size:13px; }
  button { background:#7C5CFC; color:#fff; font-weight:600; border:none; border-radius:12px;
    height:44px; padding:0 22px; font-size:14px; cursor:pointer; margin-top:20px; }
  button:hover { background:#6344E8; }
  button:disabled { opacity:.5; cursor:default; }
  .erro { color:#F04438; font-size:13px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
<main>
  <div class="logo"><div class="marca-k">k</div><div class="nome">Kyvvo People</div></div>
  <div class="card" id="conteudo">Carregando...</div>
</main>

<script>
  const vagaId = window.location.pathname.split('/').filter(Boolean).pop();
  const conteudo = document.getElementById('conteudo');

  function telaErro(msg) {
    conteudo.innerHTML = `<h1>Vaga não encontrada</h1><p class="corpo">${msg}</p>`;
  }

  function telaSucesso() {
    conteudo.innerHTML = `
      <h1>Candidatura enviada com sucesso</h1>
      <p class="corpo">Obrigado por se candidatar! Seus dados e currículo foram recebidos e já estão disponíveis para a equipe de recrutamento.</p>`;
  }

  function telaVaga(vaga) {
    conteudo.innerHTML = `
      <h1>${vaga.nome}</h1>
      ${vaga.empresa || vaga.cidade ? `<p class="corpo">${[vaga.empresa, vaga.cidade].filter(Boolean).join(' · ')}</p>` : ''}
      <div class="meta">
        ${vaga.tipo_vaga ? `<span class="pill">${vaga.tipo_vaga}</span>` : ''}
        ${vaga.nivel_experiencia ? `<span class="pill">${vaga.nivel_experiencia}</span>` : ''}
        ${vaga.modalidade ? `<span class="pill">${vaga.modalidade}</span>` : ''}
        ${vaga.salario ? `<span class="pill">${vaga.salario}</span>` : ''}
        ${vaga.cargo ? `<span class="pill">${vaga.cargo}</span>` : ''}
      </div>

      <h2>Descrição</h2>
      <p class="corpo">${vaga.descricao}</p>

      <h2>Requisitos</h2>
      <p class="corpo">${vaga.requisitos}</p>

      ${vaga.competencias ? `
        <h2>Competências</h2>
        <p class="corpo">${vaga.competencias}</p>
      ` : ''}

      <h2>Candidate-se</h2>
      <form id="form-candidatura">
        <label class="campo" for="nome">Nome completo *</label>
        <input type="text" id="nome" required>

        <label class="campo" for="whatsapp">WhatsApp *</label>
        <input type="text" id="whatsapp" placeholder="Com DDD" required>

        <label class="campo" for="email">E-mail *</label>
        <input type="email" id="email" required>

        <label class="campo" for="linkedin">LinkedIn</label>
        <input type="text" id="linkedin" placeholder="https://linkedin.com/in/...">

        <label class="campo" for="curriculo">Currículo (PDF ou DOCX) *</label>
        <input type="file" id="curriculo" accept=".pdf,.docx" required>

        <div class="erro" id="erro"></div>
        <button type="submit" id="btn-enviar">Enviar candidatura</button>
      </form>
    `;

    document.getElementById('form-candidatura').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erro = document.getElementById('erro');
      const btn = document.getElementById('btn-enviar');
      erro.textContent = '';

      const arquivo = document.getElementById('curriculo').files[0];
      if (!arquivo) { erro.textContent = 'Anexe seu currículo.'; return; }

      const form = new FormData();
      form.append('nome', document.getElementById('nome').value);
      form.append('whatsapp', document.getElementById('whatsapp').value);
      form.append('email', document.getElementById('email').value);
      form.append('linkedin', document.getElementById('linkedin').value);
      form.append('curriculo', arquivo);

      btn.disabled = true;
      try {
        const res = await fetch(`/people/api/vaga-publica/${vagaId}/candidatar`, { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Não foi possível enviar sua candidatura');
        telaSucesso();
      } catch (err) {
        erro.textContent = err.message;
        btn.disabled = false;
      }
    });
  }

  async function iniciar() {
    try {
      const res = await fetch(`/people/api/vaga-publica/${vagaId}`);
      const data = await res.json();
      if (!res.ok) return telaErro(data.error || 'Esta vaga não está mais disponível.');
      telaVaga(data);
    } catch {
      telaErro('Não foi possível carregar a vaga. Tente novamente em instantes.');
    }
  }

  iniciar();
</script>
</body>
</html>
