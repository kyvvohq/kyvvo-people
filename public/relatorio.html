<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo People — Relatório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#F8F9FC; color:#0F111A; font-family:'Inter',Arial,Helvetica,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:20px 32px; border-bottom:1px solid #E7EAF2; background:#fff; }
  .logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .logo .marca-k { width:28px; height:28px; border-radius:8px; background:#0F111A; color:#fff;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .logo .nome { font-size:15px; font-weight:700; }
  a.voltar { color:#6B7385; text-decoration:none; font-size:13px; }
  a.voltar:hover { color:#0F111A; }
  main { max-width:720px; margin:0 auto; padding:32px; }
  .card { background:#fff; border:1px solid #E7EAF2; border-radius:16px; padding:24px; margin-bottom:24px; }
  h1 { font-family:'Space Grotesk',sans-serif; }
  h2 { font-size:12px; color:#6B7385; margin:0 0 16px; text-transform:uppercase; letter-spacing:.06em; }

  .topo { text-align:center; margin-bottom:32px; }
  .avatar { width:64px; height:64px; border-radius:50%; border:2px solid #7C5CFC; display:flex;
    align-items:center; justify-content:center; margin:0 auto 16px; font-weight:800; font-size:20px; color:#7C5CFC; background:#F1EEFF; }
  .topo h1 { font-size:22px; margin:0 0 6px; text-transform:capitalize; }
  .topo .tags { color:#7C5CFC; font-weight:700; font-size:13px; margin-bottom:8px; }
  .topo .tagline { color:#6B7385; font-size:13px; }

  .pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .pill { font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; }
  .pill.perfil { background:#F1EEFF; color:#4E33C4; }
  .pill.mbti { background:#12B76A1A; color:#12B76A; }
  .pill.traco { background:#F790091F; color:#B54708; }
  .card ul.bullets { margin:0; padding-left:18px; font-size:13px; line-height:1.8; color:#2B3040; }

  .radar-legenda { display:flex; gap:20px; justify-content:center; font-size:12px; color:#6B7385; margin-top:8px; }
  .radar-legenda span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

  .barra-linha { margin-bottom:16px; }
  .barra-label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .barra-label .valores { color:#6B7385; font-size:12px; }
  .barra-fundo { background:#F1F3F8; border-radius:6px; height:8px; overflow:hidden; margin-bottom:3px; }
  .barra-preenchida { height:100%; border-radius:6px; }
  .barra-fundo.r2 { height:5px; }

  .gap-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .gap-box { border-radius:12px; padding:14px 16px; font-size:12px; }
  .gap-box.alinhamento { background:#F1EEFF; color:#4E33C4; }
  .gap-box.atencao { background:#F790091F; color:#B54708; }
  .gap-box h3 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin:0 0 8px; opacity:.8; }
  .gap-box div.item { padding:2px 0; }

  .mbti-tipo { text-align:center; margin-bottom:20px; }
  .mbti-tipo .letras { font-family:'Space Grotesk',sans-serif; font-size:32px; font-weight:700; color:#7C5CFC; letter-spacing:.04em; }
  .mbti-tipo .nome { font-size:14px; color:#0F111A; margin-top:4px; }
  .mbti-tipo .desc { font-size:12px; color:#6B7385; margin-top:4px; }
  .dicotomia { margin-bottom:14px; }
  .dicotomia-labels { display:flex; justify-content:space-between; font-size:12px; color:#98A0B0; margin-bottom:6px; }
  .dicotomia-labels .ativo { color:#12B76A; font-weight:700; }
  .dicotomia-track { position:relative; height:6px; background:#F1F3F8; border-radius:6px; }
  .dicotomia-preenchido { position:absolute; top:0; left:0; height:100%; background:#12B76A; border-radius:6px; }
  .dicotomia-marcador { position:absolute; top:50%; width:12px; height:12px; background:#7C5CFC; border-radius:50%;
    transform:translate(-50%,-50%); border:2px solid #fff; box-shadow:0 0 0 1px #E7EAF2; }

  .ocean-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:520px) { .ocean-grid, .gap-grid { grid-template-columns:1fr; } }
  .ocean-card { background:#F8F9FC; border:1px solid #E7EAF2; border-radius:12px; padding:14px; }
  .ocean-card .nome-valor { display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:8px; }
  .ocean-card .desc { font-size:11px; color:#6B7385; margin-top:8px; line-height:1.5; }
  .ocean-card .impacto { font-size:12px; color:#2B3040; margin-top:8px; line-height:1.6; padding-top:8px; border-top:1px solid #E7EAF2; }

  .subsecao { margin-top:18px; }
  .subsecao h3 { font-size:12px; color:#6B7385; text-transform:uppercase; letter-spacing:.04em; margin:0 0 8px; }
  .ambiente-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:520px) { .ambiente-grid { grid-template-columns:1fr; } }
  .ambiente-box { border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.6; }
  .ambiente-box.ideal { background:#12B76A1A; color:#0C7A47; }
  .ambiente-box.risco { background:#F790091F; color:#B54708; }
  .ambiente-box h4 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px; opacity:.85; }
  .lideranca-box { margin-top:12px; background:#F1EEFF; color:#4E33C4; border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.6; }
  .lideranca-box h4 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px; opacity:.85; }

  .mbti-dimensoes { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
  @media(max-width:520px) { .mbti-dimensoes { grid-template-columns:1fr; } }
  .mbti-dimensao { background:#F8F9FC; border:1px solid #E7EAF2; border-radius:12px; padding:12px 14px; }
  .mbti-dimensao h4 { font-size:11px; color:#7C5CFC; text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px; }
  .mbti-dimensao p { font-size:12.5px; color:#2B3040; line-height:1.55; margin:0; }

  .rel-secao { margin-bottom:18px; }
  .rel-secao:last-child { margin-bottom:0; }
  .rel-secao h3 { font-size:12px; margin:0 0 8px; }
  .rel-secao.fortes h3 { color:#12B76A; }
  .rel-secao.atencao h3 { color:#B54708; }
  .rel-secao.aproveitar h3 { color:#7C5CFC; }
  .rel-secao ul { margin:0; padding-left:18px; font-size:13px; line-height:1.8; color:#2B3040; }

  button, .btn { background:#7C5CFC; color:#fff; font-weight:600; border:none; border-radius:12px;
    height:40px; padding:0 20px; font-size:14px; cursor:pointer; }
  button:hover { background:#6344E8; }
  .acoes { display:flex; gap:10px; justify-content:center; margin-top:20px; }
</style>
</head>
<body>
  <header>
    <a class="logo" href="/people/painel.html" aria-label="Ir para o início"><div class="marca-k">k</div><div class="nome">Kyvvo People</div></a>
    <a class="voltar" href="/people/avaliacoes.html">← Voltar às avaliações</a>
  </header>
  <main id="conteudo">Carregando...</main>

  <script>
    const token = localStorage.getItem('people_token');
    if (!token) window.location.href = '/people/login.html';
    const id = new URLSearchParams(window.location.search).get('id');

    const NOMES = { A: 'Analista', C: 'Comunicador', E: 'Executor', P: 'Planejador' };
    const CORES_PERFIL = { A: '#7C5CFC', C: '#12B76A', E: '#F79009', P: '#0BA3CC' };

    function svgRadar(r1, r2) {
      const cx = 165, cy = 130, raio = 65;
      const eixos = [
        { chave: 'A', angulo: -Math.PI / 2, ancora: 'middle' },
        { chave: 'C', angulo: 0, ancora: 'start' },
        { chave: 'E', angulo: Math.PI / 2, ancora: 'middle' },
        { chave: 'P', angulo: Math.PI, ancora: 'end' },
      ];
      const ponto = (angulo, escala) => `${cx + Math.cos(angulo) * raio * escala},${cy + Math.sin(angulo) * raio * escala}`;
      const poligono = (dados) => eixos.map((e) => ponto(e.angulo, dados[e.chave] / 100)).join(' ');

      const grades = [0.25, 0.5, 0.75, 1].map((escala) =>
        `<polygon points="${eixos.map((e) => ponto(e.angulo, escala)).join(' ')}" fill="none" stroke="#E7EAF2" stroke-width="1"/>`
      ).join('');
      const linhas = eixos.map((e) => `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(e.angulo) * raio}" y2="${cy + Math.sin(e.angulo) * raio}" stroke="#E7EAF2" stroke-width="1"/>`).join('');
      const labelPos = eixos.map((e) => {
        const lx = cx + Math.cos(e.angulo) * (raio + 16);
        const ly = cy + Math.sin(e.angulo) * (raio + 16);
        return `<text x="${lx}" y="${ly}" fill="#6B7385" font-size="12" text-anchor="${e.ancora}" dominant-baseline="middle">${NOMES[e.chave]}</text>`;
      }).join('');

      return `
        <svg viewBox="0 0 330 260" width="100%" style="max-width:380px;display:block;margin:0 auto">
          ${grades}${linhas}
          <polygon points="${poligono(r1)}" fill="#7C5CFC" fill-opacity="0.16" stroke="#7C5CFC" stroke-width="2"/>
          <polygon points="${poligono(r2)}" fill="#12B76A" fill-opacity="0.12" stroke="#12B76A" stroke-width="2" stroke-dasharray="4,3"/>
          ${labelPos}
        </svg>`;
    }

    function barrasComparativas(r1, r2) {
      return Object.keys(NOMES).map((p) => `
        <div class="barra-linha">
          <div class="barra-label"><span>${NOMES[p]}</span><span class="valores">${r1[p]}% / ${r2[p]}%</span></div>
          <div class="barra-fundo"><div class="barra-preenchida" style="width:${r1[p]}%;background:${CORES_PERFIL[p]}"></div></div>
          <div class="barra-fundo r2"><div class="barra-preenchida" style="width:${r2[p]}%;background:${CORES_PERFIL[p]};opacity:.5"></div></div>
        </div>
      `).join('');
    }

    function gapCards(gaps) {
      const alinhados = Object.values(gaps).filter((g) => g.leitura === 'Alinhamento');
      const seVe = Object.values(gaps).filter((g) => g.leitura === 'Você se vê mais assim');
      const outros = Object.values(gaps).filter((g) => g.leitura === 'Os outros te veem mais assim');

      let html = '<div class="gap-grid">';
      if (alinhados.length) {
        html += `<div class="gap-box alinhamento"><h3>Alinhamento</h3>${alinhados.map((g) => `<div class="item">${g.nome}</div>`).join('')}</div>`;
      }
      const divergentes = [...seVe, ...outros];
      if (divergentes.length) {
        html += `<div class="gap-box atencao"><h3>Divergências</h3>${divergentes.map((g) => `<div class="item">${g.nome}: ${g.leitura} (${g.diff > 0 ? '+' : ''}${g.diff}%)</div>`).join('')}</div>`;
      }
      html += '</div>';
      return html;
    }

    const DICOTOMIAS = [
      { chave: 'ei', neg: 'Introversão', pos: 'Extroversão' },
      { chave: 'sn', neg: 'Intuição', pos: 'Sensação' },
      { chave: 'tf', neg: 'Sentimento', pos: 'Pensamento' },
      { chave: 'jp', neg: 'Percepção', pos: 'Julgamento' },
    ];

    function mbtiDicotomias(mbti) {
      return DICOTOMIAS.map((d) => {
        const info = mbti.dicotomias[d.chave];
        const posicao = ((info.normalizado + 100) / 200) * 100;
        const negAtivo = info.normalizado < 0;
        return `
          <div class="dicotomia">
            <div class="dicotomia-labels">
              <span class="${negAtivo ? 'ativo' : ''}">${d.neg}</span>
              <span class="${!negAtivo ? 'ativo' : ''}">${d.pos}</span>
            </div>
            <div class="dicotomia-track">
              <div class="dicotomia-preenchido" style="width:${posicao}%"></div>
              <div class="dicotomia-marcador" style="left:${posicao}%"></div>
            </div>
          </div>`;
      }).join('');
    }

    function oceanCards(bigFive, tracoDescricoes, tracoImpactos) {
      return `<div class="ocean-grid">${Object.keys(bigFive).map((chave) => {
        const t = bigFive[chave];
        return `
          <div class="ocean-card">
            <div class="nome-valor"><span>${t.nome}</span><span>${t.percentil}%</span></div>
            <div class="barra-fundo"><div class="barra-preenchida" style="width:${t.percentil}%;background:#7C5CFC"></div></div>
            <div class="desc">${tracoDescricoes[chave]}</div>
            <div class="impacto">${tracoImpactos[chave]}</div>
          </div>`;
      }).join('')}</div>`;
    }

    function listaItens(itens) {
      return itens.map((i) => `<li>${i}</li>`).join('');
    }

    async function carregar() {
      const res = await fetch(`/people/api/candidatos/${id}/relatorio`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (res.status === 401) { window.location.href = '/people/login.html'; return; }
      const c = await res.json();
      if (!res.ok) {
        document.getElementById('conteudo').textContent = c.error || 'Erro ao carregar relatório';
        return;
      }
      const r = c.resultado;
      const resumo = c.resumo;

      document.getElementById('conteudo').innerHTML = `
        <div class="topo">
          <div class="avatar">${resumo.iniciais}</div>
          <h1>${c.nome}</h1>
          <div class="tags">${NOMES[r.perfilDominante.perfil]} · ${r.mbti.tipo} · OCEAN</div>
          <div class="tagline">${resumo.tagline}</div>
        </div>

        <div class="card">
          <h2>Perfil identificado</h2>
          <div class="pills">
            <span class="pill perfil">${NOMES[r.perfilDominante.perfil]}</span>
            <span class="pill mbti">${r.mbti.tipo} — ${resumo.mbtiNome}</span>
            ${resumo.tracosMarcantes.map((t) => `<span class="pill traco">${t.nome} elevado</span>`).join('')}
          </div>
          <ul class="bullets">${listaItens(resumo.bulletsResumo)}</ul>
        </div>

        <div class="card">
          <h2>Big Five — OCEAN</h2>
          ${oceanCards(r.bigFive, resumo.tracoDescricoes, resumo.tracoImpactos)}
        </div>

        <div class="card">
          <h2>Profiler comportamental</h2>
          ${svgRadar(r.rodada1.profiler, r.rodada2.profiler)}
          <div class="radar-legenda">
            <span><span class="dot" style="background:#7C5CFC"></span>Como me vejo</span>
            <span><span class="dot" style="background:#12B76A"></span>Como os outros me veem</span>
          </div>
          <div class="subsecao">
            <div class="ambiente-grid">
              <div class="ambiente-box ideal"><h4>Ambiente ideal</h4>${resumo.ambienteIdeal}</div>
              <div class="ambiente-box risco"><h4>Ambiente de risco</h4>${resumo.ambienteRisco}</div>
            </div>
            <div class="lideranca-box"><h4>Estilo de liderança esperado</h4>${resumo.estiloLideranca}</div>
          </div>
        </div>

        <div class="card">
          ${barrasComparativas(r.rodada1.profiler, r.rodada2.profiler)}
        </div>

        <div class="card">
          <h2>Análise de gaps</h2>
          ${gapCards(r.gaps)}
        </div>

        <div class="card">
          <h2>Tipo MBTI detalhado</h2>
          <div class="mbti-tipo">
            <div class="letras">${r.mbti.tipo}</div>
            <div class="nome">${resumo.mbtiNome}</div>
            <div class="desc">${resumo.mbtiDescricao}</div>
          </div>
          ${mbtiDicotomias(r.mbti)}
          <div class="mbti-dimensoes">
            <div class="mbti-dimensao"><h4>Como se comunica</h4><p>${resumo.mbtiDimensoes.comoComunica}</p></div>
            <div class="mbti-dimensao"><h4>Como toma decisões</h4><p>${resumo.mbtiDimensoes.comoDecide}</p></div>
            <div class="mbti-dimensao"><h4>Como reage sob pressão</h4><p>${resumo.mbtiDimensoes.comoReagePressao}</p></div>
            <div class="mbti-dimensao"><h4>Como lidera</h4><p>${resumo.mbtiDimensoes.comoLidera}</p></div>
            <div class="mbti-dimensao"><h4>Como aprende</h4><p>${resumo.mbtiDimensoes.comoAprende}</p></div>
          </div>
        </div>

        <div class="card">
          <h2>Relação com o perfil</h2>
          <div class="rel-secao fortes"><h3>Pontos fortes</h3><ul>${listaItens(resumo.pontosFortes)}</ul></div>
          <div class="rel-secao atencao"><h3>Pontos de atenção</h3><ul>${listaItens(resumo.pontosAtencao)}</ul></div>
          <div class="rel-secao aproveitar"><h3>Como aproveitar melhor esse perfil</h3><ul>${listaItens(resumo.comoAproveitar)}</ul></div>
        </div>

        <div class="acoes">
          <button id="btn-pdf">Exportar PDF</button>
        </div>
      `;

      document.getElementById('btn-pdf').addEventListener('click', async () => {
        const res = await fetch(`/people/api/candidatos/${id}/relatorio.pdf`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return;
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `relatorio-${c.nome.replace(/\s+/g, '-')}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    carregar();
  </script>
</body>
</html>
