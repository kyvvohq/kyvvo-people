    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Avaliações</h1></div>
        </div>
      </div>

      <div class="card" style="padding:0">
        <div class="filtros">
          <select id="filtro-vaga"><option value="">Todas as vagas</option></select>
          <select id="filtro-status">
            <option value="">Todos os status</option>
            <option value="sem_envio">Sem avaliação enviada</option>
            <option value="pendente">Pendente</option>
            <option value="iniciado">Em andamento</option>
            <option value="concluido">Concluído</option>
          </select>
          <input id="filtro-busca" placeholder="Buscar por nome ou e-mail">
        </div>
        <table>
          <thead>
            <tr>
              <th class="ordenavel" data-col="nome">Nome<span class="seta">▲</span></th>
              <th class="ordenavel" data-col="email">E-mail<span class="seta">▲</span></th>
              <th class="ordenavel" data-col="vaga">Vaga<span class="seta">▲</span></th>
              <th class="ordenavel" data-col="status">Status<span class="seta">▲</span></th>
              <th class="ordenavel" data-col="criado_em">Cadastrado em<span class="seta">▲</span></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabela-candidatos"></tbody>
        </table>
      </div>
    </div>

  <footer data-ds-rodape data-ds-produto="People"></footer>

  <script src="/ds/components.js"></script>
  <script src="/people/shell.js"></script>
  <script>
    const STATUS_CLASSE = { pendente: 'neutro', iniciado: 'aviso', concluido: 'sucesso' };
    const STATUS_LABEL = { pendente: 'Pendente', iniciado: 'Em andamento', concluido: 'Concluído' };
    const SEM_ENVIO_LABEL = 'Sem avaliação enviada';

    let candidatos = [];
    let vagasPorCandidato = new Map();
    let ordenacao = { coluna: 'criado_em', direcao: 'desc' };

    async function carregarListas() {
      const [resCand, resVagas, resCandidaturas] = await Promise.all([
        apiFetch('/people/api/avaliacoes'),
        apiFetch('/people/api/vagas'),
        apiFetch('/people/api/candidaturas'),
      ]);
      candidatos = await resCand.json();
      const vagas = await resVagas.json();
      const candidaturas = await resCandidaturas.json();

      vagasPorCandidato = new Map();
      candidaturas.forEach((c) => {
        if (!vagasPorCandidato.has(c.candidato_id)) vagasPorCandidato.set(c.candidato_id, new Set());
        vagasPorCandidato.get(c.candidato_id).add(c.vaga_nome);
      });

      const selectVaga = document.getElementById('filtro-vaga');
      const vagaAtual = selectVaga.value;
      selectVaga.innerHTML = '<option value="">Todas as vagas</option>' + vagas.map((v) => `<option value="${v.nome}">${v.nome}</option>`).join('');
      selectVaga.value = vagaAtual;
    }

    function vagasDoCandidato(c) {
      const set = vagasPorCandidato.get(c.candidato_id);
      return set ? Array.from(set) : [];
    }

    function aplicarFiltrosEOrdenacao() {
      const vagaFiltro = document.getElementById('filtro-vaga').value;
      const statusFiltro = document.getElementById('filtro-status').value;
      const busca = document.getElementById('filtro-busca').value.trim().toLowerCase();

      let lista = candidatos.filter((c) => {
        const statusChave = c.status || 'sem_envio';
        if (statusFiltro && statusChave !== statusFiltro) return false;
        if (vagaFiltro && !vagasDoCandidato(c).includes(vagaFiltro)) return false;
        if (busca && !(`${c.nome} ${c.email || ''}`.toLowerCase().includes(busca))) return false;
        return true;
      });

      const { coluna, direcao } = ordenacao;
      const chave = (c) => {
        if (coluna === 'status') return c.status ? STATUS_LABEL[c.status] : SEM_ENVIO_LABEL;
        if (coluna === 'vaga') return vagasDoCandidato(c).join(', ');
        if (coluna === 'criado_em') return new Date(c.criado_em).getTime();
        return (c[coluna] || '').toString().toLowerCase();
      };
      lista.sort((a, b) => {
        const va = chave(a);
        const vb = chave(b);
        const cmp = va < vb ? -1 : va > vb ? 1 : 0;
        return direcao === 'asc' ? cmp : -cmp;
      });

      return lista;
    }

    function renderizarCabecalhoOrdenacao() {
      document.querySelectorAll('th.ordenavel').forEach((th) => {
        const ativa = th.dataset.col === ordenacao.coluna;
        th.classList.toggle('ativa', ativa);
        th.querySelector('.seta').textContent = ativa && ordenacao.direcao === 'desc' ? '▼' : '▲';
      });
    }

    function renderizarTabela() {
      renderizarCabecalhoOrdenacao();
      const lista = aplicarFiltrosEOrdenacao();
      const corpo = document.getElementById('tabela-candidatos');
      corpo.innerHTML = lista.map((c) => {
        const statusChave = c.status || 'sem_envio';
        const statusLabel = c.status ? STATUS_LABEL[c.status] : SEM_ENVIO_LABEL;
        const statusClasse = c.status ? STATUS_CLASSE[c.status] : 'neutro';
        const vagas = vagasDoCandidato(c).join(', ') || '—';
        let acoes = '';
        if (c.status === 'concluido') {
          acoes = `
            <a class="acao" href="/people/relatorio.html?id=${c.id}">Ver relatório</a>
            <a class="acao" href="#" data-pdf="${c.id}" data-nome="${c.nome}">Exportar PDF</a>
            <a class="acao" href="#" data-refazer="${c.id}" data-nome="${c.nome}">Refazer avaliação</a>
          `;
        } else if (statusChave === 'sem_envio') {
          acoes = `<a class="acao" href="#" data-encaminhar="${c.candidato_id}" data-nome="${c.nome}">Enviar avaliação</a>`;
        } else {
          acoes = `<a class="acao" href="#" data-encaminhar="${c.candidato_id}" data-nome="${c.nome}">Reenviar avaliação</a>`;
        }
        return `
          <tr>
            <td>${c.nome}</td>
            <td>${c.email || '—'}</td>
            <td>${vagas}</td>
            <td><span class="badge ${statusClasse}">${statusLabel}</span></td>
            <td>${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td>
            <td>${acoes}</td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="6" class="vazio">Nenhum candidato cadastrado ainda.</td></tr>';
    }

    document.querySelectorAll('th.ordenavel').forEach((th) => {
      th.addEventListener('click', () => {
        if (ordenacao.coluna === th.dataset.col) {
          ordenacao.direcao = ordenacao.direcao === 'asc' ? 'desc' : 'asc';
        } else {
          ordenacao = { coluna: th.dataset.col, direcao: 'asc' };
        }
        renderizarTabela();
      });
    });

    ['filtro-vaga', 'filtro-status'].forEach((id) => document.getElementById(id).addEventListener('change', renderizarTabela));
    document.getElementById('filtro-busca').addEventListener('input', renderizarTabela);

    // O gate de acesso ao link não pede mais CPF, é o e-mail já cadastrado
    // no perfil — então encaminhar/reenviar não precisa coletar nada, é
    // uma ação de 1 clique.
    async function acionarEnvio(candidatoId, nome) {
      const res = await apiFetch(`/people/api/candidatos/${candidatoId}/enviar-avaliacao`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        avisar('Erro', data.error || 'Falha ao encaminhar avaliação');
        return;
      }
      if (data.reenviada) avisar('Avaliação reenviada', `Link reenviado por e-mail para ${nome}.`);
      else if (data.reaproveitada) avisar('Avaliação reaproveitada', 'Essa pessoa já tinha uma avaliação concluída recente — reaproveitada, nenhum link novo foi enviado.');
      else avisar('Avaliação enviada', `Convite enviado por e-mail para ${nome}.`);
      await carregarListas();
      renderizarTabela();
    }

    function confirmarRefazer(id, nome) {
      abrirModal(
        '<h3>Refazer avaliação?</h3>',
        `
          <p class="modal-texto">O resultado atual de "${nome}" vai para o histórico e o mesmo link poderá ser usado de novo.</p>
          <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="cancelar-refazer">Cancelar</button>
            <button type="button" class="btn" id="confirmar-refazer">Refazer</button>
          </div>
        `
      );
      document.getElementById('cancelar-refazer').addEventListener('click', fecharModal);
      document.getElementById('confirmar-refazer').addEventListener('click', async () => {
        fecharModal();
        const res = await apiFetch(`/people/api/avaliacoes/${id}/refazer`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) { avisar('Erro', data.error || 'Falha ao refazer avaliação'); return; }
        avisar('Avaliação resetada', `Link: ${data.link}`);
        await carregarListas();
        renderizarTabela();
      });
    }

    document.getElementById('tabela-candidatos').addEventListener('click', async (e) => {
      const pdf = e.target.closest('[data-pdf]');
      if (pdf) {
        e.preventDefault();
        const res = await apiFetch(`/people/api/avaliacoes/${pdf.dataset.pdf}/relatorio.pdf`);
        if (!res.ok) return;
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `relatorio-${pdf.dataset.nome.replace(/\s+/g, '-')}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
        return;
      }

      const refazer = e.target.closest('[data-refazer]');
      if (refazer) {
        e.preventDefault();
        confirmarRefazer(refazer.dataset.refazer, refazer.dataset.nome);
        return;
      }

      const encaminhar = e.target.closest('[data-encaminhar]');
      if (encaminhar) {
        e.preventDefault();
        acionarEnvio(encaminhar.dataset.encaminhar, encaminhar.dataset.nome);
      }
    });

    async function iniciar() {
      await carregarListas();
      renderizarTabela();
    }
    iniciar();
  </script>
</body>
