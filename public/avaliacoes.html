<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo People — Avaliações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/people/shell.css">
</head>
<body>
  <div class="app-shell">
    <aside class="painel-sidebar" id="painel-sidebar">
      <a class="marca-produto" href="/people/painel.html" aria-label="Ir para o início">
        <div class="marca-k">k</div>
        <div class="textos">
          <div class="produto">Kyvvo People</div>
          <div class="conta" id="conta-nome"></div>
        </div>
      </a>
      <nav class="grupo-menu">
        <div class="grupo-titulo">Seleção</div>
        <a class="menu-item" href="/people/painel.html"><span data-icon="layout-dashboard"></span><span class="rotulo">Visão geral</span></a>
        <a class="menu-item" href="/people/vagas.html"><span data-icon="briefcase"></span><span class="rotulo">Vagas</span></a>
        <a class="menu-item" href="/people/candidatos.html"><span data-icon="users"></span><span class="rotulo">Candidatos</span></a>
        <a class="menu-item" href="/people/avaliacoes.html"><span data-icon="brain"></span><span class="rotulo">Avaliações</span></a>
      </nav>
      <nav class="grupo-menu">
        <div class="grupo-titulo">Gestão</div>
        <a class="menu-item" href="/people/quadro.html"><span data-icon="kanban"></span><span class="rotulo">Quadro</span></a>
        <a class="menu-item" href="/people/whatsapp.html"><span data-icon="message-circle"></span><span class="rotulo">WhatsApp</span></a>
        <a class="menu-item" href="/people/configuracoes.html"><span data-icon="settings"></span><span class="rotulo">Configurações</span></a>
      </nav>
      <div class="sidebar-espacador"></div>
      <div class="cartao-usuario" id="cartao-usuario">
        <div class="avatar" id="avatar-usuario"></div>
        <div class="textos">
          <div class="nome" id="nome-usuario"></div>
          <div class="papel">Recrutador(a)</div>
        </div>
        <button id="btn-menu-usuario" type="button" aria-label="Menu do usuário"><span data-icon="ellipsis" data-size="16"></span></button>
        <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
          <button class="user-menu-sair" id="btn-sair" type="button">Sair</button>
        </div>
      </div>
    </aside>
    <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" type="button" aria-label="Ocultar menu" title="Ocultar menu">&lt;</button>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1>Avaliações</h1><span class="contagem" id="contagem-candidatos"></span></div>
          <p class="descricao">Avaliação comportamental (Profiler, MBTI e Big Five) por link — sem o candidato criar conta.</p>
        </div>
        <div class="acoes">
          <button class="btn" id="btn-novo-candidato" type="button"><span data-icon="plus" data-size="16"></span>Novo candidato</button>
        </div>
      </div>

      <div class="card" style="padding:0">
        <table>
          <thead><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Cadastrado em</th><th></th></tr></thead>
          <tbody id="tabela-candidatos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="rodape-app">
    <p class="rodape-app-copy">© 2026 <img src="/people/images/logo-kyvvo.svg" alt="Kyvvo" class="rodape-logo-img">. Todos os direitos reservados.</p>
  </footer>

  <script src="/people/shell.js"></script>
  <script>
    const STATUS_CLASSE = { pendente: 'neutro', iniciado: 'aviso', concluido: 'sucesso' };
    const STATUS_LABEL = { pendente: 'Pendente', iniciado: 'Em andamento', concluido: 'Concluído' };

    async function carregarCandidatos() {
      const res = await apiFetch('/people/api/candidatos');
      const candidatos = await res.json();
      document.getElementById('contagem-candidatos').textContent = candidatos.length;
      const corpo = document.getElementById('tabela-candidatos');
      corpo.innerHTML = candidatos.map((c) => `
        <tr>
          <td>${c.nome}</td>
          <td>${c.email}</td>
          <td><span class="badge ${STATUS_CLASSE[c.status]}">${STATUS_LABEL[c.status]}</span></td>
          <td>${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td>
          <td>${c.status === 'concluido' ? `
            <a class="acao" href="/people/relatorio.html?id=${c.id}">Ver relatório</a>
            <a class="acao" href="#" data-pdf="${c.id}" data-nome="${c.nome}">Exportar PDF</a>
            <a class="acao" href="#" data-refazer="${c.id}" data-nome="${c.nome}">Refazer avaliação</a>
          ` : ''}</td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="vazio">Nenhum candidato cadastrado ainda.</td></tr>';
    }

    function abrirModalNovoCandidato() {
      abrirModal(
        '<h3>Novo candidato</h3>',
        `
          <form id="form-candidato">
            <div class="modal-erro" id="msg-candidato"></div>
            <label for="nome">Nome completo</label>
            <input id="nome" required>
            <label for="email">E-mail</label>
            <input id="email" type="email" required>
            <label for="cpf">CPF (só números)</label>
            <input id="cpf" required>
            <div class="modal-acoes">
              <button type="button" class="btn-secundario" id="btn-cancelar-candidato">Cancelar</button>
              <button type="submit" class="btn">Enviar avaliação</button>
            </div>
          </form>
        `
      );

      document.getElementById('btn-cancelar-candidato').addEventListener('click', fecharModal);
      document.getElementById('form-candidato').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('msg-candidato');
        msg.textContent = '';
        try {
          const res = await apiFetch('/people/api/candidatos', {
            method: 'POST',
            body: JSON.stringify({
              nome: document.getElementById('nome').value,
              email: document.getElementById('email').value,
              cpf: document.getElementById('cpf').value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Falha ao cadastrar candidato');
          fecharModal();
          carregarCandidatos();
        } catch (err) {
          msg.textContent = err.message;
        }
      });
    }

    document.getElementById('btn-novo-candidato').addEventListener('click', abrirModalNovoCandidato);

    document.getElementById('tabela-candidatos').addEventListener('click', async (e) => {
      const pdf = e.target.closest('[data-pdf]');
      if (pdf) {
        e.preventDefault();
        const res = await apiFetch(`/people/api/candidatos/${pdf.dataset.pdf}/relatorio.pdf`);
        if (!res.ok) return;
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `relatorio-${pdf.dataset.nome.replace(/\s+/g, '-')}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
        return;
      }

      const refazer = e.target.closest('[data-refazer]');
      if (refazer) {
        e.preventDefault();
        const confirmar = confirm(`Refazer a avaliação de ${refazer.dataset.nome}? O resultado atual vai para o histórico e o mesmo link poderá ser usado de novo.`);
        if (!confirmar) return;
        const res = await apiFetch(`/people/api/candidatos/${refazer.dataset.refazer}/refazer`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) { alert(data.error || 'Falha ao refazer avaliação'); return; }
        alert(`Avaliação resetada. Link: ${data.link}`);
        carregarCandidatos();
      }
    });

    carregarCandidatos();
  </script>
</body>
</html>
