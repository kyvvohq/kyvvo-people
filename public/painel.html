<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo People — Início</title>
<link rel="stylesheet" href="/people/shell.css">
<style>
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  @media(max-width:600px) { .stats { grid-template-columns:1fr; } }
  .stat-card .num { font-size:28px; font-weight:800; }
  .stat-card .lbl { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .acoes-rapidas { display:flex; gap:12px; flex-wrap:wrap; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="/people/painel.html" aria-label="Ir para o início">ky<span>vv</span>o people</a>
    <div class="user-menu" id="user-menu">
      <button class="user-menu-toggle" id="user-menu-toggle" type="button">
        <div class="user-menu-avatar" id="user-menu-avatar"></div>
        <div class="user-menu-textos">
          <div class="user-menu-nome" id="user-menu-nome"></div>
          <div class="user-menu-empresa">Kyvvo People</div>
        </div>
        <span class="user-menu-chevron">▾</span>
      </button>
      <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
        <button class="user-menu-sair" id="btn-sair" type="button"><span aria-hidden="true">⎋</span> Sair</button>
      </div>
    </div>
  </div>
  <div class="painel-shell">
    <aside class="painel-sidebar" id="painel-sidebar">
      <nav class="menu">
        <a class="menu-item" href="/people/painel.html">Início</a>
        <a class="menu-item" href="/people/vagas.html">Vagas</a>
        <a class="menu-item" href="/people/candidatos.html">Candidatos</a>
        <a class="menu-item" href="/people/whatsapp.html">WhatsApp</a>
        <a class="menu-item" href="/people/configuracoes.html">Configurações</a>
      </nav>
    </aside>
    <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" aria-label="Ocultar menu" title="Ocultar menu" type="button">&lt;</button>
    <div class="painel-main">
      <div class="conteudo">
        <div class="cabecalho-pagina">
          <h1 id="saudacao">Início</h1>
        </div>

        <div class="stats">
          <div class="card stat-card"><div class="lbl">Vagas abertas</div><div class="num" id="stat-vagas">—</div></div>
          <div class="card stat-card"><div class="lbl">Candidatos avaliados</div><div class="num" id="stat-avaliados">—</div></div>
          <div class="card stat-card"><div class="lbl">Total de candidatos</div><div class="num" id="stat-candidatos">—</div></div>
        </div>

        <div class="card">
          <h2 style="font-size:16px;margin:0 0 16px">Ações rápidas</h2>
          <div class="acoes-rapidas">
            <a class="btn" href="/people/vagas.html">+ Nova vaga</a>
            <a class="btn btn-secundario" href="/people/candidatos.html">+ Novo candidato</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="rodape-app">
    <p class="rodape-app-copy">© 2026 <img src="/people/images/logo-kyvvo.svg" alt="Kyvvo" class="rodape-logo-img">. Todos os direitos reservados.</p>
  </footer>

  <script src="/people/shell.js"></script>
  <script>
    document.getElementById('saudacao').textContent = `Olá, ${(localStorage.getItem('people_nome') || '').split(' ')[0] || ''}`;

    async function carregarStats() {
      const [vagasRes, candidatosRes] = await Promise.all([
        apiFetch('/people/api/vagas'),
        apiFetch('/people/api/candidatos'),
      ]);
      const vagas = await vagasRes.json();
      const candidatos = await candidatosRes.json();

      document.getElementById('stat-vagas').textContent = vagas.filter((v) => v.status !== 'encerrada').length;
      document.getElementById('stat-avaliados').textContent = candidatos.filter((c) => c.status === 'concluido').length;
      document.getElementById('stat-candidatos').textContent = candidatos.length;
    }

    carregarStats();
  </script>
</body>
</html>
