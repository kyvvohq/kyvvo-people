<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo People — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/people/shell.css">
<style>
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-4); }
  @media(max-width:700px) { .stats { grid-template-columns:1fr; } }
  .stat-card .lbl { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .stat-card .num { font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--text); }
  .acoes-rapidas { display:flex; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="painel-sidebar" id="painel-sidebar">
      <a class="marca-produto" href="/people/painel.html" aria-label="Ir para o início">
        <div class="marca-k">k</div>
        <div class="textos">
          <div class="produto">Kyvvo People</div>
          <div class="conta" id="conta-nome"></div>
        </div>
      </a>
      <nav class="grupo-menu">
        <div class="grupo-titulo">Seleção</div>
        <a class="menu-item" href="/people/painel.html"><span data-icon="layout-dashboard"></span><span class="rotulo">Visão geral</span></a>
        <a class="menu-item" href="/people/vagas.html"><span data-icon="briefcase"></span><span class="rotulo">Vagas</span></a>
        <a class="menu-item" href="/people/candidatos.html"><span data-icon="users"></span><span class="rotulo">Candidatos</span></a>
        <a class="menu-item" href="/people/avaliacoes.html"><span data-icon="brain"></span><span class="rotulo">Avaliações</span></a>
      </nav>
      <nav class="grupo-menu">
        <div class="grupo-titulo">Gestão</div>
        <a class="menu-item" href="/people/quadro.html"><span data-icon="kanban"></span><span class="rotulo">Quadro</span></a>
        <a class="menu-item" href="/people/whatsapp.html"><span data-icon="message-circle"></span><span class="rotulo">WhatsApp</span></a>
        <a class="menu-item" href="/people/configuracoes.html"><span data-icon="settings"></span><span class="rotulo">Configurações</span></a>
      </nav>
      <div class="sidebar-espacador"></div>
      <div class="cartao-usuario" id="cartao-usuario">
        <div class="avatar" id="avatar-usuario"></div>
        <div class="textos">
          <div class="nome" id="nome-usuario"></div>
          <div class="papel">Recrutador(a)</div>
        </div>
        <button id="btn-menu-usuario" type="button" aria-label="Menu do usuário"><span data-icon="ellipsis" data-size="16"></span></button>
        <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
          <button class="user-menu-sair" id="btn-sair" type="button">Sair</button>
        </div>
      </div>
    </aside>
    <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" type="button" aria-label="Ocultar menu" title="Ocultar menu">&lt;</button>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos">
          <div class="linha-titulo"><h1 id="saudacao">Início</h1></div>
          <p class="descricao">Resumo do seu processo seletivo.</p>
        </div>
      </div>

      <div class="stats">
        <div class="card stat-card"><div class="lbl">Vagas abertas</div><div class="num" id="stat-vagas">—</div></div>
        <div class="card stat-card"><div class="lbl">Candidatos avaliados</div><div class="num" id="stat-avaliados">—</div></div>
        <div class="card stat-card"><div class="lbl">Total de candidatos</div><div class="num" id="stat-candidatos">—</div></div>
      </div>

      <div class="card">
        <h2 style="font-size:15px;margin:0 0 14px;color:var(--text)">Ações rápidas</h2>
        <div class="acoes-rapidas">
          <a class="btn" href="/people/vagas.html"><span data-icon="plus" data-size="16"></span>Nova vaga</a>
          <a class="btn btn-secundario" href="/people/avaliacoes.html"><span data-icon="plus" data-size="16"></span>Novo candidato</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="rodape-app">
    <p class="rodape-app-copy">© 2026 <img src="/people/images/logo-kyvvo.svg" alt="Kyvvo" class="rodape-logo-img">. Todos os direitos reservados.</p>
  </footer>

  <script src="/people/shell.js"></script>
  <script>
    document.getElementById('saudacao').textContent = `Olá, ${(localStorage.getItem('people_nome') || '').split(' ')[0] || ''}`;

    async function carregarStats() {
      const [vagasRes, candidatosRes] = await Promise.all([
        apiFetch('/people/api/vagas'),
        apiFetch('/people/api/candidatos'),
      ]);
      const vagas = await vagasRes.json();
      const candidatos = await candidatosRes.json();

      document.getElementById('stat-vagas').textContent = vagas.filter((v) => v.status !== 'encerrada').length;
      document.getElementById('stat-avaliados').textContent = candidatos.filter((c) => c.status === 'concluido').length;
      document.getElementById('stat-candidatos').textContent = candidatos.length;
    }

    carregarStats();
  </script>
</body>
</html>
