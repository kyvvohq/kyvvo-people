<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var m={escuro:'dark',claro:'light',dark:'dark',light:'light'};document.documentElement.setAttribute('data-theme',m[localStorage.getItem('people_tema')]||'light');})();</script>
<title>Kyvvo People — Login</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<style>
  /* Reset mínimo — esta página não carrega shell.css (sem sidebar/topbar),
     só o necessário pro .ds-login cobrir a tela inteira sem a margem padrão
     do body. Mesmo padrão do /crm/login.html. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
</style>
</head>
<body>
  <div class="ds-login">
    <div class="ds-login-cartao">
      <div class="ds-topbar-marca ds-login-marca">
        <span class="ds-topbar-produto"><span class="ds-topbar-produto-acento">Pe</span>ople</span>
        <span class="ds-topbar-kyvvo">kyvvo</span>
      </div>
      <form class="ds-login-form" id="form">
        <div class="ds-campo">
          <label class="ds-rotulo" for="email">E-mail</label>
          <input class="ds-input ds-login-input" type="email" id="email" required autocomplete="username">
        </div>
        <div class="ds-campo">
          <label class="ds-rotulo" for="senha">Senha</label>
          <input class="ds-input ds-login-input" type="password" id="senha" required autocomplete="current-password">
        </div>
        <div class="ds-campo-erro" id="erro" hidden></div>
        <button type="submit" class="ds-btn ds-btn-primario ds-btn-bloco ds-btn-lg ds-login-entrar" id="btn">Entrar</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById('form');
    const erro = document.getElementById('erro');
    const btn = document.getElementById('btn');

    if (localStorage.getItem('people_token')) {
      window.location.href = '/people/painel.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.hidden = true;
      btn.disabled = true;
      try {
        const res = await fetch('/people/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: document.getElementById('senha').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Falha no login');
        localStorage.setItem('people_token', data.token);
        localStorage.setItem('people_nome', data.nome || '');
        localStorage.setItem('people_outros_produtos', JSON.stringify(data.outros_produtos || []));
        window.location.href = '/people/painel.html';
      } catch (err) {
        erro.hidden = false;
        erro.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
