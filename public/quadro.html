<script>(function(){var m={escuro:'dark',claro:'light',dark:'dark',light:'light'};document.documentElement.setAttribute('data-theme',m[localStorage.getItem('people_tema')]||'light');})();</script>

<style>
  .painel-main { overflow-x:hidden; }
  .filtros { display:flex; gap:10px; }
  .filtro { position:relative; }
  .filtro-painel { position:absolute; top:calc(100% + 8px); left:0; min-width:220px; max-height:280px; overflow-y:auto;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:0 12px 32px rgba(15,17,26,.12);
    padding:8px; z-index:60; }
  /* O filtro de Etapas é o 2º da fileira — alinhado à esquerda ele
     estoura a borda direita de .painel-main (que tem overflow-x:hidden
     de propósito, pra não deixar o quadro rolar a página inteira) e fica
     cortado. Abrindo pra esquerda (right:0) ele nunca sai da área visível. */
  #painel-filtro-etapas { left:auto; right:0; }
  .filtro-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; }
  .filtro-item:hover { background:var(--surface-muted); }
  .filtro-item input { width:auto; }

  .quadro-scroll { overflow-x:auto; padding-bottom:12px; }
  .quadro-grid { display:grid; grid-auto-rows:min-content; gap:10px; align-items:start; }
  .raia-label { position:sticky; left:0; background:var(--bg); padding:10px 8px; font-weight:700; font-size:13px;
    display:flex; align-items:center; z-index:3; color:var(--text); }
  .coluna-header { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px;
    display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; min-width:220px; color:var(--text); }
  .coluna-header.arrastavel { cursor:grab; }
  .coluna-header.arrastando-coluna { opacity:.4; }
  .coluna-header.recebendo-coluna { border-color:var(--accent); }
  .coluna-header.fixa { color:var(--muted); font-weight:600; position:sticky; left:200px; z-index:2; min-width:200px; background:var(--card); }
  .coluna-header .nome-etapa { flex:1; cursor:text; }
  .coluna-header input.editar-nome { width:100%; background:transparent; border:1px solid var(--accent); border-radius:6px; padding:2px 6px; font-size:13px; color:var(--text); }
  .coluna-header button { background:transparent; color:var(--muted); width:auto; height:auto; margin:0; padding:2px 6px; font-size:12px; border-radius:6px; }
  .coluna-header button:hover { background:var(--surface-muted); color:var(--text); }
  .coluna-header .btn-automacao.tem-automacao { color:var(--accent); }
  .coluna-header .btn-automacao svg { display:block; }

  .automacao-item { border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:10px; }
  .automacao-item-topo { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .automacao-canal { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--muted-strong); }
  .automacao-nome { font-size:13.5px; font-weight:600; color:var(--text); margin-bottom:8px; }
  .automacao-acoes { display:flex; gap:14px; }
  .automacao-acoes .btn-link { background:none; border:none; padding:0; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; width:auto; height:auto; }
  .automacao-acoes .btn-link.perigo { color:var(--danger); }
  .badge-obrigatoria { font-size:11px; font-weight:600; padding:3px 8px; border-radius:var(--radius-full); background:var(--border); color:var(--muted-strong); }
  .toggle-automacao { width:36px; height:20px; border-radius:999px; background:var(--border-strong); border:none; position:relative; cursor:pointer; padding:0; }
  .toggle-automacao .bolinha { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle-automacao[aria-checked="true"] { background:var(--accent); }
  .toggle-automacao[aria-checked="true"] .bolinha { left:18px; }
  .campo-automacao { margin-bottom:12px; }
  .campo-automacao label { display:block; font-size:13px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; }
  .campo-automacao textarea { min-height:110px; resize:vertical; font-family:inherit; }
  .campo-automacao .ajuda { font-size:12px; color:var(--muted); margin-top:4px; }
  .preview-whatsapp { margin-top:10px; background:#e5ddd5; border-radius:10px; padding:16px; }
  .preview-whatsapp .bolha { background:#dcf8c6; border-radius:8px 8px 8px 2px; padding:10px 12px; font-size:13.5px; line-height:1.5; color:#111b21; max-width:280px; white-space:pre-wrap; box-shadow:0 1px 1px rgba(0,0,0,.1); }
  .preview-whatsapp .bolha-botao { margin-top:2px; max-width:280px; background:#dcf8c6; border-top:1px solid rgba(0,0,0,.08); border-radius:0 0 8px 2px; padding:8px 12px; font-size:13px; color:#00a5f4; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  .coluna-add { display:flex; align-items:center; min-width:180px; }
  .coluna-add input { font-size:13px; height:38px; padding:0 10px; }

  .celula { background:var(--bg); border:1px dashed var(--border-strong); border-radius:var(--radius-md); padding:8px; min-width:220px; min-height:60px;
    display:flex; flex-direction:column; gap:6px; }
  .celula.arrastando-sobre { border-color:var(--accent); background:var(--accent-tint); }
  .celula.fixa { position:sticky; left:200px; z-index:1; min-width:200px; background:var(--bg); }
  .cartao { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; cursor:grab; }
  .cartao:active { cursor:grabbing; }
  .cartao .nome { font-weight:700; margin-bottom:2px; color:var(--text); }
  .cartao .data { color:var(--muted); font-size:11px; }
  .celula-vazia { color:var(--muted); font-size:11px; padding:6px; }
</style>
</head>

  <script>
    let dados = { vagas: [], etapas: [], candidaturas: [] };
    let automacoes = [];
    const filtroVagas = new Set();
    const filtroEtapas = new Set();
    const TIPO_ARRASTO_COLUNA = 'application/x-etapa-id';

    // Tons leves derivados da paleta do DS (accent/cyan/success/warning),
    // só pra diferenciar visualmente as raias — não tem significado de
    // status, é só rotação por posição.
    const CORES_RAIA = [
      '#F1EEFF', // accent tint (roxo)
      '#E6F9FC', // cyan tint
      '#E9FBF2', // success tint (verde)
      '#FFF6E8', // warning tint (âmbar)
    ];

    async function carregar() {
      const [resKanban, resAutomacoes] = await Promise.all([
        apiFetch('/people/api/kanban'),
        apiFetch('/people/api/automacoes'),
      ]);
      dados = await resKanban.json();
      automacoes = await resAutomacoes.json();
      montarFiltros();
      renderizarQuadro();
    }

    function montarFiltroGenerico(painelId, itens, selecionados, aoMudar) {
      const painel = document.getElementById(painelId);
      painel.innerHTML = itens.map((item) => `
        <label class="filtro-item">
          <input type="checkbox" value="${item.id}" ${selecionados.has(item.id) ? 'checked' : ''}>
          ${item.nome}
        </label>
      `).join('') || '<div class="filtro-item">Nada pra filtrar ainda</div>';

      painel.querySelectorAll('input').forEach((input) => {
        input.addEventListener('change', () => {
          if (input.checked) selecionados.add(input.value);
          else selecionados.delete(input.value);
          aoMudar();
        });
      });
    }

    function montarFiltros() {
      montarFiltroGenerico('painel-filtro-vagas', dados.vagas, filtroVagas, renderizarQuadro);
      // "Nova" é fixa, não entra no filtro — só as etapas de verdade são filtráveis.
      montarFiltroGenerico('painel-filtro-etapas', dados.etapas, filtroEtapas, renderizarQuadro);
    }

    function alternarPainel(painelId, outroPainelId) {
      const painel = document.getElementById(painelId);
      document.getElementById(outroPainelId).hidden = true;
      painel.hidden = !painel.hidden;
    }
    document.getElementById('btn-filtro-vagas').addEventListener('click', (e) => {
      e.stopPropagation();
      alternarPainel('painel-filtro-vagas', 'painel-filtro-etapas');
    });
    document.getElementById('btn-filtro-etapas').addEventListener('click', (e) => {
      e.stopPropagation();
      alternarPainel('painel-filtro-etapas', 'painel-filtro-vagas');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.filtro')) {
        document.getElementById('painel-filtro-vagas').hidden = true;
        document.getElementById('painel-filtro-etapas').hidden = true;
      }
    });

    // Candidaturas reprovadas saem do quadro — o pipeline mostra só quem
    // ainda está em processo.
    function candidaturasDe(vagaId, etapaId) {
      return dados.candidaturas.filter((c) => c.vaga_id === vagaId && (c.etapa_id || null) === etapaId && c.status !== 'reprovada');
    }

    function renderizarCartao(c) {
      return `
        <div class="cartao" draggable="true" data-candidatura="${c.id}">
          <div class="nome">${c.nome}</div>
          <div class="data">${new Date(c.criado_em).toLocaleDateString('pt-BR')}</div>
        </div>
      `;
    }

    function renderizarQuadro() {
      const vagas = dados.vagas.filter((v) => filtroVagas.size === 0 || filtroVagas.has(v.id));
      const etapas = dados.etapas.filter((e) => filtroEtapas.size === 0 || filtroEtapas.has(e.id));
      const colunas = [{ id: null, chave: 'nova', nome: 'Nova', fixa: true }, ...etapas.map((e) => ({ ...e, chave: e.id }))];

      const grid = document.getElementById('quadro-grid');
      grid.style.gridTemplateColumns = `200px 200px repeat(${etapas.length}, minmax(220px, 1fr)) 200px`;

      let html = '<div></div>';
      colunas.forEach((col) => {
        const gatilhoAutomacoes = col.fixa
          ? automacoes.filter((a) => a.gatilho === 'candidatura_criada')
          : automacoes.filter((a) => a.gatilho === 'etapa_alcancada' && a.etapa_id === col.id);
        const temAtiva = gatilhoAutomacoes.some((a) => a.ativo);
        const btnAutomacao = `
          <button type="button" class="btn-automacao${temAtiva ? ' tem-automacao' : ''}"
            data-automacao-etapa="${col.id || ''}" data-automacao-nome="${col.fixa ? 'Nova' : col.nome}"
            title="Automações desta etapa">${icon('zap', 14)}</button>
        `;
        if (col.fixa) {
          html += `<div class="coluna-header fixa"><span class="nome-etapa">Nova</span>${btnAutomacao}</div>`;
        } else {
          html += `
            <div class="coluna-header arrastavel" draggable="true" data-etapa="${col.id}">
              <span class="nome-etapa" data-editar="${col.id}">${col.nome}</span>
              ${btnAutomacao}
              <button type="button" data-apagar="${col.id}" data-nome="${col.nome}" title="Apagar etapa">✕</button>
            </div>
          `;
        }
      });
      html += `
        <div class="coluna-add">
          <input type="text" id="input-nova-etapa" placeholder="+ Nova etapa (Enter)">
        </div>
      `;

      vagas.forEach((vaga, indice) => {
        const cor = CORES_RAIA[indice % CORES_RAIA.length];
        html += `<div class="raia-label" style="background:${cor}">${vaga.nome}</div>`;
        colunas.forEach((col) => {
          const cartoes = candidaturasDe(vaga.id, col.id);
          html += `
            <div class="celula${col.fixa ? ' fixa' : ''}" data-vaga="${vaga.id}" data-etapa="${col.id || ''}" style="background:${cor}">
              ${cartoes.map(renderizarCartao).join('') || '<div class="celula-vazia">—</div>'}
            </div>
          `;
        });
        html += '<div></div>';
      });

      grid.innerHTML = html || '';
      if (!vagas.length) {
        grid.insertAdjacentHTML('beforeend', '<div class="celula-vazia" style="grid-column:1/-1">Nenhuma vaga com candidatura pra mostrar (confira os filtros).</div>');
      }

      ligarEventosGrid();
    }

    function confirmarApagarEtapa(id, nome) {
      const overlay = abrirModal(
        '<h3>Apagar etapa?</h3>',
        `
          <p class="modal-texto">As candidaturas em "${nome}" voltam para "Nova". Essa ação não pode ser desfeita.</p>
          <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="cancelar-apagar-etapa">Cancelar</button>
            <button type="button" class="btn-perigo" id="confirmar-apagar-etapa">Apagar etapa</button>
          </div>
        `
      );
      document.getElementById('cancelar-apagar-etapa').addEventListener('click', fecharModal);
      document.getElementById('confirmar-apagar-etapa').addEventListener('click', async () => {
        fecharModal();
        await apiFetch(`/people/api/etapas/${id}`, { method: 'DELETE' });
        carregar();
      });
      return overlay;
    }

    // --- Automações (⚡ no cabeçalho de cada coluna) ---
    const CANAL_LABEL = { email: 'E-mail', whatsapp: 'WhatsApp' };
    const CANAL_ICONE = { email: 'file-text', whatsapp: 'message-circle' };

    // etapaId null = coluna fixa "Nova" (gatilho candidatura_criada); senão,
    // etapa_alcancada pra aquela etapa.
    function abrirModalAutomacoesEtapa(etapaId, etapaNome) {
      const contexto = etapaId
        ? { gatilho: 'etapa_alcancada', etapaId, titulo: `Automações — ${etapaNome}` }
        : { gatilho: 'candidatura_criada', etapaId: null, titulo: 'Automações — Candidatura recebida' };
      renderModalListaAutomacoes(contexto);
    }

    // Quadro geral = só automações SEM vaga (vaga_id null) — as específicas
    // de uma vaga só aparecem/editam dentro da tela daquela vaga
    // (vagas.html), não aqui, pra não confundir "isso vale pra todo mundo"
    // com "isso é só dessa vaga".
    function itensDoContexto(contexto) {
      return automacoes.filter((a) => a.gatilho === contexto.gatilho && (a.etapa_id || null) === contexto.etapaId && !a.vaga_id);
    }

    function itemAutomacaoHtml(a) {
      return `
        <div class="automacao-item">
          <div class="automacao-item-topo">
            <span class="automacao-canal">${icon(CANAL_ICONE[a.canal], 14)} ${CANAL_LABEL[a.canal]}</span>
            ${a.removivel
              ? `<button type="button" class="toggle-automacao" data-toggle-automacao="${a.id}" role="switch" aria-checked="${a.ativo}"><span class="bolinha"></span></button>`
              : '<span class="badge-obrigatoria">Obrigatória</span>'}
          </div>
          <div class="automacao-nome">${a.nome}</div>
          <div class="automacao-acoes">
            <button type="button" class="btn-link" data-ver-automacao="${a.id}">Editar</button>
            <button type="button" class="btn-link" data-duplicar-automacao="${a.id}">Duplicar</button>
            ${a.removivel ? `<button type="button" class="btn-link perigo" data-excluir-automacao="${a.id}">Excluir</button>` : ''}
          </div>
        </div>
      `;
    }

    function renderModalListaAutomacoes(contexto) {
      const itens = itensDoContexto(contexto);
      const podeCriar = contexto.gatilho === 'etapa_alcancada';
      const overlay = abrirModal(
        `<h3>${contexto.titulo}</h3>`,
        `
          <div id="lista-automacoes">${itens.length ? itens.map(itemAutomacaoHtml).join('') : '<p class="modal-texto">Nenhuma automação aqui ainda.</p>'}</div>
          ${podeCriar ? '<div class="modal-acoes"><button type="button" class="btn-secundario" id="btn-nova-automacao">+ Nova automação</button></div>' : ''}
        `,
        'modal-card-larga'
      );

      overlay.querySelectorAll('[data-toggle-automacao]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const automacao = automacoes.find((a) => a.id === btn.dataset.toggleAutomacao);
          await apiFetch(`/people/api/automacoes/${automacao.id}`, { method: 'PATCH', body: JSON.stringify({ ativo: !automacao.ativo }) });
          await carregar();
          renderModalListaAutomacoes(contexto);
        });
      });
      overlay.querySelectorAll('[data-ver-automacao]').forEach((btn) => {
        btn.addEventListener('click', () => {
          renderModalFormAutomacao(contexto, automacoes.find((a) => a.id === btn.dataset.verAutomacao));
        });
      });
      overlay.querySelectorAll('[data-duplicar-automacao]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/people/api/automacoes/${btn.dataset.duplicarAutomacao}/duplicar`, { method: 'POST' });
          await carregar();
          renderModalListaAutomacoes(contexto);
        });
      });
      overlay.querySelectorAll('[data-excluir-automacao]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await apiFetch(`/people/api/automacoes/${btn.dataset.excluirAutomacao}`, { method: 'DELETE' });
          await carregar();
          renderModalListaAutomacoes(contexto);
        });
      });
      const btnNova = overlay.querySelector('#btn-nova-automacao');
      if (btnNova) btnNova.addEventListener('click', () => renderModalFormAutomacao(contexto, null));
    }

    // Só pra referência dentro do texto (Placeholders disponíveis:) e pra
    // preencher a prévia do WhatsApp com um exemplo — mesma ordem de
    // lib/automacoes.js (PARAMETROS_CORPO_TEMPLATE), documentado lá.
    const EXEMPLO_PARAMETROS_CORPO = {
      candidatura_criada: ['Maria Silva', 'Desenvolvedora Backend'],
      etapa_alcancada: ['Maria Silva', 'Desenvolvedora Backend', 'Entrevista'],
      candidatura_reprovada: ['Maria Silva', 'Desenvolvedora Backend'],
      vaga_encerrada: ['Maria Silva', 'Desenvolvedora Backend'],
    };

    // automacao=null => criação. `obrigatoria` (removivel=false) só trava
    // ativar/desativar e excluir (nas rotas/lista) — nunca a edição. No
    // WhatsApp, "editar" é só escolher o template: o nome (rótulo na lista)
    // e o texto vêm do próprio template aprovado, não são digitados —
    // Nome/Mensagem só aparecem (editáveis) pro canal e-mail.
    function renderModalFormAutomacao(contexto, automacao) {
      const obrigatoria = !!(automacao && !automacao.removivel);
      const canalAtual = automacao ? automacao.canal : 'email';
      const overlay = abrirModal(
        `<h3>${automacao ? 'Editar automação' : 'Nova automação'}</h3>`,
        `
          ${obrigatoria ? '<p class="modal-texto">Automação obrigatória — não pode ser desativada nem excluída, mas você pode trocar o template.</p>' : ''}
          ${!automacao ? `
          <div class="campo-automacao">
            <label>Canal</label>
            <select id="form-canal">
              <option value="email">E-mail</option>
              <option value="whatsapp">WhatsApp</option>
            </select>
          </div>` : ''}
          <div class="campo-automacao" id="wrap-nome" ${canalAtual === 'whatsapp' ? 'hidden' : ''}>
            <label>Nome (só pra identificar na lista)</label>
            <input type="text" id="form-nome" value="${automacao ? automacao.nome.replace(/"/g, '&quot;') : ''}">
          </div>
          <div class="campo-automacao" id="wrap-assunto" ${canalAtual === 'whatsapp' ? 'hidden' : ''}>
            <label>Assunto do e-mail</label>
            <input type="text" id="form-assunto" value="${automacao && automacao.assunto ? automacao.assunto.replace(/"/g, '&quot;') : ''}">
          </div>
          <div class="campo-automacao" id="wrap-mensagem" ${canalAtual === 'whatsapp' ? 'hidden' : ''}>
            <label>Mensagem</label>
            <textarea id="form-corpo">${automacao ? automacao.corpo : ''}</textarea>
            <div class="ajuda">Placeholders disponíveis: {{nome}}, {{vaga}}, {{empresa}}, {{etapa}}${contexto.gatilho === 'candidatura_criada' ? ', {{link_avaliacao}}' : ''}</div>
          </div>
          <div class="campo-automacao" id="wrap-template" ${canalAtual === 'email' ? 'hidden' : ''}>
            <label>Template aprovado na Meta (WhatsApp)</label>
            <select id="form-template-select" hidden></select>
            <input type="text" id="form-template" value="${automacao && automacao.whatsapp_template ? automacao.whatsapp_template : ''}" placeholder="ex.: candidatura_recebida_pt">
            <div class="ajuda" id="ajuda-template">Sem template aprovado aqui, o envio fica em modo de teste (só loga, não manda de verdade).</div>
            <div class="preview-whatsapp" id="preview-whatsapp" hidden>
              <div class="bolha" id="preview-whatsapp-corpo"></div>
              <div class="bolha-botao" id="preview-whatsapp-botao" hidden></div>
            </div>
          </div>
          <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="btn-voltar-automacao">Voltar</button>
            <button type="button" class="btn" id="btn-salvar-automacao">Salvar</button>
          </div>
        `,
        'modal-card-larga'
      );

      document.getElementById('btn-voltar-automacao').addEventListener('click', () => renderModalListaAutomacoes(contexto));

      let templatesCache = [];
      let templatesCarregados = false;
      const sincronizarWhatsapp = () => {
        const nomeTemplate = valorTemplateEscolhido();
        const template = templatesCache.find((t) => t.nome === nomeTemplate);
        atualizarPreviewWhatsapp(template, contexto.gatilho);
        document.getElementById('form-nome').value = nomeTemplate || '';
        document.getElementById('form-corpo').value = template ? (template.corpo || '') : (nomeTemplate ? 'Mensagem definida pelo template aprovado na Meta.' : '');
      };
      if (canalAtual === 'whatsapp') {
        montarSeletorTemplate(automacao ? automacao.whatsapp_template : '', sincronizarWhatsapp).then((lista) => {
          templatesCache = lista; templatesCarregados = true; sincronizarWhatsapp();
        });
        document.getElementById('form-template').addEventListener('input', sincronizarWhatsapp);
      }

      const selectCanal = document.getElementById('form-canal');
      if (selectCanal) {
        selectCanal.addEventListener('change', () => {
          const ehWhatsapp = selectCanal.value === 'whatsapp';
          document.getElementById('wrap-nome').hidden = ehWhatsapp;
          document.getElementById('wrap-assunto').hidden = ehWhatsapp;
          document.getElementById('wrap-mensagem').hidden = ehWhatsapp;
          document.getElementById('wrap-template').hidden = !ehWhatsapp;
          if (ehWhatsapp) {
            document.getElementById('form-template').addEventListener('input', sincronizarWhatsapp);
            if (!templatesCarregados) {
              templatesCarregados = true;
              montarSeletorTemplate('', sincronizarWhatsapp).then((lista) => { templatesCache = lista; sincronizarWhatsapp(); });
            } else {
              sincronizarWhatsapp();
            }
          }
        });
      }

      const btnSalvar = document.getElementById('btn-salvar-automacao');
      btnSalvar.addEventListener('click', async () => {
        const canal = automacao ? automacao.canal : selectCanal.value;
        if (canal === 'whatsapp') sincronizarWhatsapp();
        const nome = document.getElementById('form-nome').value.trim();
        const corpo = document.getElementById('form-corpo').value.trim();
        if (!nome || !corpo) { avisar('Erro', canal === 'whatsapp' ? 'Escolha um template' : 'Nome e mensagem são obrigatórios'); return; }
        const payload = {
          nome, corpo,
          assunto: canal === 'email' ? document.getElementById('form-assunto').value.trim() : null,
          whatsapp_template: canal === 'whatsapp' ? valorTemplateEscolhido() : null,
        };
        btnSalvar.disabled = true;
        if (automacao) {
          await apiFetch(`/people/api/automacoes/${automacao.id}`, { method: 'PATCH', body: JSON.stringify(payload) });
        } else {
          await apiFetch('/people/api/automacoes', {
            method: 'POST',
            body: JSON.stringify({ ...payload, gatilho: contexto.gatilho, etapa_id: contexto.etapaId, canal }),
          });
        }
        await carregar();
        renderModalListaAutomacoes(contexto);
      });
    }

    // Lê o campo do select (quando a lista da Meta carregou e uma opção real
    // está escolhida) ou o input manual (lista vazia, ou "Digitar manualmente"
    // escolhido) — qual dos dois vale depende de qual está visível.
    function valorTemplateEscolhido() {
      const select = document.getElementById('form-template-select');
      const input = document.getElementById('form-template');
      if (!select.hidden && select.value !== '__manual__') return select.value;
      return input.value.trim();
    }

    // Prévia no estilo balão do WhatsApp: pega o corpo aprovado do template
    // selecionado, troca {{1}}/{{2}}... por valores de exemplo (mesma ordem
    // documentada em lib/automacoes.js) e mostra o botão de link, se houver.
    function atualizarPreviewWhatsapp(template, gatilho) {
      const preview = document.getElementById('preview-whatsapp');
      if (!template || !template.corpo) { preview.hidden = true; return; }

      // Os templates aprovados usam parâmetro NOMEADO no corpo ({{nome}},
      // {{vaga}}...), não posicional ({{1}}, {{2}}) — troca pelo nome real
      // que a Meta devolveu (template.parametros_corpo), na mesma ordem dos
      // valores de exemplo. Template antigo/posicional (sem nome) cai pra
      // {{1}}, {{2}} mesmo.
      const exemplos = EXEMPLO_PARAMETROS_CORPO[gatilho] || [];
      let corpoPreenchido = template.corpo;
      (template.parametros_corpo || []).forEach((nomeParam, i) => {
        const chave = template.parametros_nomeados ? nomeParam : String(i + 1);
        corpoPreenchido = corpoPreenchido.replace(new RegExp(`\\{\\{${chave}\\}\\}`, 'g'), exemplos[i] || '');
      });

      document.getElementById('preview-whatsapp-corpo').textContent = corpoPreenchido;
      const botao = document.getElementById('preview-whatsapp-botao');
      botao.hidden = !template.tem_botao_url;
      if (template.tem_botao_url) botao.innerHTML = `${icon('file-text', 14)} ${template.botao_texto || 'Abrir link'}`;
      preview.hidden = false;
    }

    // Busca os templates de WhatsApp do People (a API já filtra por prefixo
    // people_, ver lib/whatsapp.js) e troca o campo de texto livre por um
    // <select> — lista vazia (sem credencial da Meta ainda, ou erro) mantém
    // o campo manual como está. Devolve a lista carregada (ou []).
    async function montarSeletorTemplate(valorAtual, aoMudar) {
      const select = document.getElementById('form-template-select');
      const input = document.getElementById('form-template');
      try {
        const res = await apiFetch('/people/api/automacoes/templates-whatsapp');
        const templates = await res.json();
        if (!Array.isArray(templates) || !templates.length) return [];

        select.innerHTML = templates.map((t) => `
          <option value="${t.nome}">${t.nome} — ${t.status}${t.tem_botao_url ? '' : ' (sem botão de link!)'}</option>
        `).join('') + '<option value="__manual__">Digitar nome manualmente…</option>';

        const bateComAlgum = templates.some((t) => t.nome === valorAtual);
        select.value = bateComAlgum ? valorAtual : (valorAtual ? '__manual__' : templates[0].nome);
        select.hidden = false;
        input.hidden = select.value !== '__manual__';
        select.addEventListener('change', () => {
          input.hidden = select.value !== '__manual__';
          aoMudar();
        });
        return templates;
      } catch (err) {
        // Sem lista da Meta (offline, sem credencial) — segue no campo manual.
        return [];
      }
    }

    function ligarEventosGrid() {
      document.querySelectorAll('.cartao').forEach((cartao) => {
        cartao.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', cartao.dataset.candidatura);
        });
      });
      document.querySelectorAll('.celula').forEach((celula) => {
        celula.addEventListener('dragover', (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          celula.classList.add('arrastando-sobre');
        });
        celula.addEventListener('dragleave', () => celula.classList.remove('arrastando-sobre'));
        celula.addEventListener('drop', async (e) => {
          if (!e.dataTransfer.types.includes('text/plain')) return;
          e.preventDefault();
          celula.classList.remove('arrastando-sobre');
          const candidaturaId = e.dataTransfer.getData('text/plain');
          const etapaId = celula.dataset.etapa || null;
          const candidatura = dados.candidaturas.find((c) => c.id === candidaturaId);
          if (!candidatura || (candidatura.etapa_id || null) === etapaId) return;

          candidatura.etapa_id = etapaId;
          renderizarQuadro();
          const res = await apiFetch(`/people/api/candidaturas/${candidaturaId}/etapa`, {
            method: 'PATCH',
            body: JSON.stringify({ etapa_id: etapaId }),
          });
          if (!res.ok) { avisar('Erro', 'Falha ao mover candidatura'); carregar(); }
        });
      });

      // Arrastar e soltar o cabeçalho de uma coluna sobre outra reordena as
      // etapas (o botão ✕ continua fixo, não participa do arrasto).
      document.querySelectorAll('.coluna-header.arrastavel').forEach((header) => {
        header.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData(TIPO_ARRASTO_COLUNA, header.dataset.etapa);
          header.classList.add('arrastando-coluna');
        });
        header.addEventListener('dragend', () => header.classList.remove('arrastando-coluna'));
        header.addEventListener('dragover', (e) => {
          if (!e.dataTransfer.types.includes(TIPO_ARRASTO_COLUNA)) return;
          e.preventDefault();
          header.classList.add('recebendo-coluna');
        });
        header.addEventListener('dragleave', () => header.classList.remove('recebendo-coluna'));
        header.addEventListener('drop', async (e) => {
          if (!e.dataTransfer.types.includes(TIPO_ARRASTO_COLUNA)) return;
          e.preventDefault();
          header.classList.remove('recebendo-coluna');
          const idArrastado = e.dataTransfer.getData(TIPO_ARRASTO_COLUNA);
          const idAlvo = header.dataset.etapa;
          if (!idArrastado || idArrastado === idAlvo) return;

          const ids = dados.etapas.map((et) => et.id);
          const doIndice = ids.indexOf(idArrastado);
          const paraIndice = ids.indexOf(idAlvo);
          if (doIndice === -1 || paraIndice === -1) return;
          ids.splice(doIndice, 1);
          ids.splice(paraIndice, 0, idArrastado);

          await apiFetch('/people/api/etapas/reordenar', { method: 'PATCH', body: JSON.stringify({ ids }) });
          carregar();
        });
      });

      document.querySelectorAll('[data-apagar]').forEach((btn) => {
        btn.addEventListener('click', () => confirmarApagarEtapa(btn.dataset.apagar, btn.dataset.nome));
      });

      document.querySelectorAll('[data-automacao-etapa]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          abrirModalAutomacoesEtapa(btn.dataset.automacaoEtapa || null, btn.dataset.automacaoNome);
        });
      });

      document.querySelectorAll('[data-editar]').forEach((span) => {
        span.addEventListener('click', () => {
          const atual = span.textContent;
          const input = document.createElement('input');
          input.className = 'editar-nome';
          input.value = atual;
          span.replaceWith(input);
          input.focus();
          input.select();

          const salvar = async () => {
            const novoNome = input.value.trim();
            if (novoNome && novoNome !== atual) {
              await apiFetch(`/people/api/etapas/${span.dataset.editar}`, {
                method: 'PATCH',
                body: JSON.stringify({ nome: novoNome }),
              });
              await carregar();
            } else {
              input.replaceWith(span);
            }
          };
          input.addEventListener('blur', salvar);
          input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
        });
      });

      const inputNova = document.getElementById('input-nova-etapa');
      if (inputNova) {
        inputNova.addEventListener('keydown', async (e) => {
          if (e.key !== 'Enter') return;
          const nome = inputNova.value.trim();
          if (!nome) return;
          inputNova.disabled = true;
          await apiFetch('/people/api/etapas', { method: 'POST', body: JSON.stringify({ nome }) });
          await carregar();
        });
      }
    }

    carregar();
  </script>
</body>
</html>
