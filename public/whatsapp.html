<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyvvo People — WhatsApp</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var m={escuro:'dark',claro:'light',dark:'dark',light:'light'};document.documentElement.setAttribute('data-theme',m[localStorage.getItem('people_tema')]||'light');})();</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/people/shell.css">
</head>
<body>
  <header class="topo-app">
    <a class="topo-logo" href="/people/painel.html" aria-label="Ir para o início">
      <img class="topo-logo-img" src="/people/images/logo-kyvvo.svg" alt="Kyvvo">
      <span class="topo-produto-tag">People</span>
    </a>
    <div class="topo-perfil" id="topo-perfil">
      <button class="topo-perfil-gatilho" id="topo-perfil-gatilho" type="button" aria-haspopup="true" aria-expanded="false">
        <div class="avatar js-avatar-usuario"></div>
        <span class="nome js-nome-usuario"></span>
        <span data-icon="chevron-down" data-size="14"></span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-perfil-usuario">
          <div class="avatar js-avatar-usuario"></div>
          <div class="textos">
            <div class="nome js-nome-usuario"></div>
            <div class="email js-email-usuario"></div>
          </div>
        </div>
        <div class="menu-perfil-divisor"></div>
        <a class="menu-perfil-item" href="/people/configuracoes.html">
          <span data-icon="settings" data-size="16"></span><span class="rotulo">Configurações</span>
        </a>
        <div class="menu-perfil-item menu-perfil-tema">
          <span data-icon="sun-moon" data-size="16"></span><span class="rotulo">Tema</span>
          <button class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Alternar tema claro/escuro"><span class="bolinha"></span></button>
        </div>
        <div class="menu-perfil-divisor"></div>
        <button class="menu-perfil-item perigo btn-sair" type="button">
          <span data-icon="log-out" data-size="16"></span><span class="rotulo">Sair da conta</span>
        </button>
      </div>
    </div>
  </header>
  <div class="app-shell">
    <div class="sidebar-wrap">
      <aside class="painel-sidebar" id="painel-sidebar">
      <nav class="grupo-menu">
        <div class="grupo-titulo">Seleção</div>
        <a class="menu-item" href="/people/painel.html"><span data-icon="layout-dashboard"></span><span class="rotulo">Visão geral</span></a>
        <a class="menu-item" href="/people/vagas.html"><span data-icon="briefcase"></span><span class="rotulo">Vagas</span></a>
        <a class="menu-item" href="/people/candidatos.html"><span data-icon="users"></span><span class="rotulo">Candidatos</span></a>
        <a class="menu-item" href="/people/avaliacoes.html"><span data-icon="brain"></span><span class="rotulo">Avaliações</span></a>
      </nav>
      <nav class="grupo-menu">
        <div class="grupo-titulo">Gestão</div>
        <a class="menu-item" href="/people/quadro.html"><span data-icon="kanban"></span><span class="rotulo">Quadro</span></a>
        <a class="menu-item" href="/people/whatsapp.html"><span data-icon="message-circle"></span><span class="rotulo">WhatsApp</span></a>
        <a class="menu-item" href="/people/automacoes.html"><span data-icon="zap"></span><span class="rotulo">Automações</span></a>
        <a class="menu-item" href="/people/configuracoes.html"><span data-icon="settings"></span><span class="rotulo">Configurações</span></a>
      </nav>
      </aside>
      <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" type="button" aria-label="Ocultar menu" title="Ocultar menu">&lt;</button>
    </div>

    <div class="painel-main">
      <div class="cabecalho-pagina">
        <div class="textos"><div class="linha-titulo"><h1>WhatsApp</h1></div></div>
      </div>
      <div class="estado-vazio">
        <div class="tile" data-icon="message-circle" data-size="26"></div>
        <h3>Em breve</h3>
        <p>Comunicação automática por WhatsApp com candidatos chega em breve por aqui.</p>
      </div>
    </div>
  </div>

  <footer data-ds-rodape></footer>

  <script src="/ds/components.js"></script>
  <script src="/people/shell.js"></script>
</body>
</html>
