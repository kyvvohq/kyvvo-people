<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaliação Comportamental — Kyvvo People</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; background:#080b14; color:#f2f2f7; font-family:Arial,Helvetica,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 24px 80px; }
  .logo { font-size:20px; font-weight:800; letter-spacing:-.03em; margin-bottom:24px; }
  .logo span { color:#a688ff; position:relative; }
  .logo span::after { content:''; position:absolute; bottom:-2px; left:0; right:0; height:2px;
    background:linear-gradient(90deg,#7c5cfc,#00d4ff); border-radius:2px; }
  .card { background:#12162a; border:1px solid #232847; border-radius:16px; padding:28px; }
  h1 { font-size:18px; margin:0 0 8px; }
  p.sub { color:#a1a5c4; font-size:14px; line-height:1.6; margin:0 0 24px; }
  label.campo { display:block; font-size:12px; color:#a1a5c4; margin:0 0 6px; }
  input[type=text] { width:100%; box-sizing:border-box; background:#080b14; border:1px solid #232847; border-radius:8px;
    padding:10px 12px; color:#f2f2f7; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:20px 0; }
  .chip { display:flex; align-items:center; gap:8px; background:#080b14; border:1px solid #232847; border-radius:8px;
    padding:8px 10px; font-size:13px; cursor:pointer; user-select:none; }
  .chip.selecionado { border-color:#a688ff; background:#1c1740; }
  .chip input { margin:0; }
  .contador { font-size:12px; color:#a1a5c4; margin-bottom:12px; }
  button { background:#a688ff; color:#080b14; font-weight:700; border:none; border-radius:10px;
    padding:12px 22px; font-size:14px; cursor:pointer; margin-top:8px; }
  button:disabled { opacity:.5; cursor:default; }
  .erro { color:#ff8080; font-size:13px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
<main>
  <div class="logo">ky<span>vv</span>o people</div>
  <div class="card" id="conteudo">Carregando...</div>
</main>

<script>
  const token = window.location.pathname.split('/').filter(Boolean).pop();
  const conteudo = document.getElementById('conteudo');
  let caracteristicas = [];
  let selecionadasRodada1 = [];

  function normalizarCpf(v) { return v.replace(/\D/g, ''); }

  function telaErro(msg) {
    conteudo.innerHTML = `<h1>Não foi possível continuar</h1><p class="sub">${msg}</p>`;
  }

  function telaConcluido() {
    conteudo.innerHTML = `
      <h1>Avaliação já concluída</h1>
      <p class="sub">Este link já foi utilizado e não pode ser respondido novamente. Se você acredita que isso é um engano, entre em contato com quem te enviou o link.</p>`;
  }

  function telaCpf(nome) {
    conteudo.innerHTML = `
      <h1>Olá${nome ? ', ' + nome : ''}!</h1>
      <p class="sub">Para começar, confirme seu CPF. O link só pode ser usado uma vez.</p>
      <label class="campo" for="cpf">CPF</label>
      <input type="text" id="cpf" placeholder="Somente números" inputmode="numeric">
      <div class="erro" id="erro"></div>
      <button id="btn-cpf">Continuar</button>
    `;
    document.getElementById('btn-cpf').addEventListener('click', async () => {
      const erro = document.getElementById('erro');
      erro.textContent = '';
      const cpf = normalizarCpf(document.getElementById('cpf').value);
      try {
        const res = await fetch(`/people/api/avaliacao/${token}/validar-cpf`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cpf }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Não foi possível validar o CPF');
        caracteristicas = data.caracteristicas;
        telaRodada(1);
      } catch (err) {
        erro.textContent = err.message;
      }
    });
  }

  function telaRodada(numero) {
    const titulo = numero === 1 ? 'Como eu me vejo' : 'Como acredito que os outros me veem';
    const sub = numero === 1
      ? 'Marque as características que mais combinam com você.'
      : 'Agora marque as características que você acredita que outras pessoas usariam para te descrever.';

    conteudo.innerHTML = `
      <h1>${titulo}</h1>
      <p class="sub">${sub}</p>
      <div class="contador" id="contador">0 selecionadas</div>
      <div class="grid" id="grid"></div>
      <div class="erro" id="erro"></div>
      <button id="btn-avancar">${numero === 1 ? 'Próxima rodada' : 'Concluir avaliação'}</button>
    `;

    const grid = document.getElementById('grid');
    grid.innerHTML = caracteristicas.map((c) => `
      <label class="chip" data-id="${c.id}">
        <input type="checkbox" value="${c.id}">
        <span>${c.texto}</span>
      </label>
    `).join('');

    const contador = document.getElementById('contador');
    grid.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', (e) => {
        if (e.target.tagName !== 'INPUT') {
          const input = chip.querySelector('input');
          input.checked = !input.checked;
        }
        chip.classList.toggle('selecionado', chip.querySelector('input').checked);
        contador.textContent = `${grid.querySelectorAll('input:checked').length} selecionadas`;
      });
    });

    document.getElementById('btn-avancar').addEventListener('click', async () => {
      const erro = document.getElementById('erro');
      erro.textContent = '';
      const selecionadas = Array.from(grid.querySelectorAll('input:checked')).map((i) => Number(i.value));
      if (!selecionadas.length) {
        erro.textContent = 'Selecione pelo menos uma característica.';
        return;
      }

      try {
        const rota = numero === 1 ? 'rodada1' : 'rodada2';
        const res = await fetch(`/people/api/avaliacao/${token}/${rota}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selecionadas }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Não foi possível salvar suas respostas');

        if (numero === 1) {
          selecionadasRodada1 = selecionadas;
          telaRodada(2);
        } else {
          telaSucesso();
        }
      } catch (err) {
        erro.textContent = err.message;
      }
    });
  }

  function telaSucesso() {
    conteudo.innerHTML = `
      <h1>Avaliação enviada com sucesso</h1>
      <p class="sub">Obrigado por participar! Suas respostas foram registradas e já estão disponíveis para quem te enviou este link.</p>`;
  }

  async function iniciar() {
    try {
      const res = await fetch(`/people/api/avaliacao/${token}`);
      const data = await res.json();
      if (!res.ok) return telaErro(data.error || 'Link inválido.');
      if (data.status === 'concluido') return telaConcluido();
      telaCpf(data.nome);
    } catch {
      telaErro('Não foi possível carregar a avaliação. Tente novamente em instantes.');
    }
  }

  iniciar();
</script>
</body>
</html>
