<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaliação Comportamental — Kyvvo People</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; background:#F8F9FC; color:#0F111A; font-family:'Inter',Arial,Helvetica,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 24px 80px; }
  .logo { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .logo .marca-k { width:28px; height:28px; border-radius:8px; background:#0F111A; color:#fff;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .logo .nome { font-size:15px; font-weight:700; }
  .card { background:#fff; border:1px solid #E7EAF2; border-radius:16px; padding:28px; }
  h1 { font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0 0 8px; }
  p.sub { color:#6B7385; font-size:14px; line-height:1.6; margin:0 0 24px; }
  label.campo { display:block; font-size:13px; font-weight:600; color:#2B3040; margin:0 0 7px; }
  input[type=text] { width:100%; box-sizing:border-box; background:#fff; border:1px solid #D7DCE8; border-radius:12px;
    height:44px; padding:0 14px; color:#0F111A; font-size:14px; font-family:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:20px 0; }
  .chip { display:flex; align-items:center; gap:8px; background:#F8F9FC; border:1px solid #E7EAF2; border-radius:10px;
    padding:8px 10px; font-size:13px; cursor:pointer; user-select:none; }
  .chip.selecionado { border-color:#7C5CFC; background:#F1EEFF; }
  .chip input { width:auto; margin:0; }
  .contador { font-size:12px; color:#6B7385; margin-bottom:12px; }
  button { background:#7C5CFC; color:#fff; font-weight:600; border:none; border-radius:12px;
    height:44px; padding:0 22px; font-size:14px; cursor:pointer; margin-top:8px; }
  button:hover { background:#6344E8; }
  button:disabled { opacity:.5; cursor:default; }
  .erro { color:#F04438; font-size:13px; margin-top:12px; min-height:16px; }
  ul.dicas { margin:0 0 24px; padding-left:18px; font-size:13px; line-height:1.9; color:#2B3040; }
  .aviso { background:#F1EEFF; border:1px solid #E4DDFF; border-radius:10px; padding:14px 16px;
    font-size:13px; color:#4E33C4; line-height:1.6; margin-bottom:24px; }
</style>
</head>
<body>
<main>
  <div class="logo"><div class="marca-k">k</div><div class="nome">Kyvvo People</div></div>
  <div class="card" id="conteudo">Carregando...</div>
</main>

<script>
  const token = window.location.pathname.split('/').filter(Boolean).pop();
  const conteudo = document.getElementById('conteudo');
  let caracteristicas = [];
  let selecionadasRodada1 = [];

  function telaErro(msg) {
    conteudo.innerHTML = `<h1>Não foi possível continuar</h1><p class="sub">${msg}</p>`;
  }

  function telaConcluido() {
    conteudo.innerHTML = `
      <h1>Avaliação já concluída</h1>
      <p class="sub">Este link já foi utilizado e não pode ser respondido novamente. Se você acredita que isso é um engano, entre em contato com quem te enviou o link.</p>`;
  }

  function telaEmail(nome) {
    conteudo.innerHTML = `
      <h1>Olá${nome ? ', ' + nome : ''}!</h1>
      <p class="sub">Para começar, confirme o e-mail para o qual este convite foi enviado. O link só pode ser usado uma vez.</p>
      <label class="campo" for="email">E-mail</label>
      <input type="text" id="email" placeholder="seu@email.com" inputmode="email" autocomplete="email">
      <div class="erro" id="erro"></div>
      <button id="btn-email">Continuar</button>
    `;
    document.getElementById('btn-email').addEventListener('click', async () => {
      const erro = document.getElementById('erro');
      erro.textContent = '';
      const email = document.getElementById('email').value.trim();
      try {
        const res = await fetch(`/people/api/avaliacao/${token}/validar-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Não foi possível validar o e-mail');
        caracteristicas = data.caracteristicas;
        telaInstrucoes();
      } catch (err) {
        erro.textContent = err.message;
      }
    });
  }

  function telaInstrucoes() {
    conteudo.innerHTML = `
      <h1>Antes de começar</h1>
      <p class="sub">A avaliação tem duas rodadas rápidas. Leva poucos minutos e não tem certo ou errado.</p>
      <ul class="dicas">
        <li>Você vai ver uma lista de características e marcar as que combinam com você.</li>
        <li>Na <strong>1ª rodada</strong>, marque como você mesmo se vê.</li>
        <li>Na <strong>2ª rodada</strong>, marque como você acredita que as outras pessoas te veem.</li>
      </ul>
      <div class="aviso">Responda da forma que se sentir melhor preenchendo — não existe uma quantidade certa de características pra marcar, nem uma resposta "correta". Vá com o que vier primeiro à cabeça.</div>
      <button id="btn-comecar">Começar avaliação</button>
    `;
    document.getElementById('btn-comecar').addEventListener('click', () => telaRodada(1));
  }

  function telaRodada(numero) {
    const titulo = numero === 1 ? 'Como eu me vejo' : 'Como acredito que os outros me veem';
    const sub = numero === 1
      ? 'Marque as características que mais combinam com você.'
      : 'Agora marque as características que você acredita que outras pessoas usariam para te descrever.';

    conteudo.innerHTML = `
      <h1>${titulo}</h1>
      <p class="sub">${sub}</p>
      <div class="contador" id="contador">0 selecionadas</div>
      <div class="grid" id="grid"></div>
      <div class="erro" id="erro"></div>
      <button id="btn-avancar">${numero === 1 ? 'Próxima rodada' : 'Concluir avaliação'}</button>
    `;

    const grid = document.getElementById('grid');
    grid.innerHTML = caracteristicas.map((c) => `
      <label class="chip" data-id="${c.id}">
        <input type="checkbox" value="${c.id}">
        <span>${c.texto}</span>
      </label>
    `).join('');

    const contador = document.getElementById('contador');
    grid.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', (e) => {
        if (e.target.tagName !== 'INPUT') {
          const input = chip.querySelector('input');
          input.checked = !input.checked;
        }
        chip.classList.toggle('selecionado', chip.querySelector('input').checked);
        contador.textContent = `${grid.querySelectorAll('input:checked').length} selecionadas`;
      });
    });

    document.getElementById('btn-avancar').addEventListener('click', async () => {
      const erro = document.getElementById('erro');
      erro.textContent = '';
      const selecionadas = Array.from(grid.querySelectorAll('input:checked')).map((i) => Number(i.value));
      if (!selecionadas.length) {
        erro.textContent = 'Selecione pelo menos uma característica.';
        return;
      }

      try {
        const rota = numero === 1 ? 'rodada1' : 'rodada2';
        const res = await fetch(`/people/api/avaliacao/${token}/${rota}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selecionadas }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Não foi possível salvar suas respostas');

        if (numero === 1) {
          selecionadasRodada1 = selecionadas;
          telaRodada(2);
        } else {
          telaSucesso();
        }
      } catch (err) {
        erro.textContent = err.message;
      }
    });
  }

  function telaSucesso() {
    conteudo.innerHTML = `
      <h1>Avaliação enviada com sucesso</h1>
      <p class="sub">Obrigado por participar! Suas respostas foram registradas e já estão disponíveis para quem te enviou este link.</p>`;
  }

  async function iniciar() {
    try {
      const res = await fetch(`/people/api/avaliacao/${token}`);
      const data = await res.json();
      if (!res.ok) return telaErro(data.error || 'Link inválido.');
      if (data.status === 'concluido') return telaConcluido();
      telaEmail(data.nome);
    } catch {
      telaErro('Não foi possível carregar a avaliação. Tente novamente em instantes.');
    }
  }

  iniciar();
</script>
</body>
</html>
