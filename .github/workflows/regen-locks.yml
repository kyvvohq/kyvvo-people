name: Regenerar package-lock (uso único)

# Workflow temporário — roda npm install com credencial real do GH Packages
# (indisponível localmente) pra atualizar o package-lock.json depois de
# adicionar @kyvvohq/whatsapp. Apagar depois de usado.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@kyvvohq"

      - name: npm install (regenera o lockfile)
        run: npm install --no-audit --no-fund

      - name: Commitar package-lock.json atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && echo "sem mudança" || git commit -m "chore: regenera package-lock.json (@kyvvohq/whatsapp)"
          git push origin HEAD:${{ github.ref_name }}
