name: Deploy to EC2

# push na branch `release` -> scp pra /opt/rh -> recria o serviço `people`.
# "merge != deploy": PR entra no `master`; publicar = promover `master` -> `release`
# (git push origin master:release, ou PR master->release). O container roda
# `npm install` no command, então pega package.json/@kyvvohq/* novos ao
# reiniciar (.npmrc + token já estão na EC2). Requer EC2_HOST, EC2_USER,
# EC2_SSH_KEY_B64 (base64 -w0 da chave privada).

on:
  push:
    branches: [release]
    paths:
      - ".npmrc"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "lib/**"
      - "db/**"
      - "public/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar chave SSH
        id: sshkey
        run: |
          KEY="$(printf '%s' '${{ secrets.EC2_SSH_KEY_B64 }}' | base64 -d)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo 'value<<KEYEOF'
            printf '%s\n' "$KEY"
            echo 'KEYEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Gravar versão do deploy
        run: |
          COMMIT_CURTO="${GITHUB_SHA::7}"
          echo "{\"commit\":\"${COMMIT_CURTO}\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json

      - name: Copiar arquivos pra EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          source: ".npmrc,index.js,package.json,package-lock.json,version.json,lib/**,db/**,public/**"
          target: "/opt/rh"

      # Health check (2026-09-25): sem isso, "o deploy rodou" só confirmava
      # que o container foi recriado, nunca que o npm install/app dentro
      # dele realmente subiu — cada checagem precisava de um round-trip
      # manual no CloudShell (docker logs + curl). Agora falha o job (com
      # os logs já impressos aqui) se `/` não responder em ~30s. Sem rota
      # /health dedicada neste repo — `/` (index.html) já confirma o
      # Fastify + static plugin de pé.
      - name: Regenerar env do SSM + recriar container + checar saúde
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          script: |
            set -e
            sudo /opt/kyvvo/scripts/gen-env-from-ssm.sh
            cd /opt/kyvvo && sudo docker compose up -d --force-recreate people
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3002/ > /dev/null; then
                echo "OK: / respondeu na tentativa ${i} (~$((i * 2))s)."
                exit 0
              fi
              sleep 2
            done
            echo "::error::/ não respondeu depois de ~30s — logs do container:"
            sudo docker logs kyvvo-people-1 --tail 80
            exit 1
